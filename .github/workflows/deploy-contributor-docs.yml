name: Deploy Contributor Documentation

on:
  push:
    branches: [main]
    paths:
      - "contributor-docs/**"
      - "ROADMAP.md"
      - "ARCHITECTURE.md"
      - "docs/**"
      - ".github/workflows/deploy-contributor-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with every other workflow that writes to gh-pages (deploy-docs.yml,
# preview-docs.yml, preview-contributor-docs.yml) - see deploy-docs.yml's own
# copy of this comment for the full reasoning. Publishing into a different
# subfolder of gh-pages than docs-site's own deploy does NOT make the two
# safe to run concurrently: JamesIves/github-pages-deploy-action still
# fetches/commits/pushes the branch as a whole, so two workflows racing for
# the same ref can still exhaust its retry budget regardless of which
# subfolder either one touches - confirmed directly when this workflow and
# deploy-docs.yml both fired for the same main push and deploy-docs.yml lost
# after 3 rebase-and-retry attempts.
concurrency:
  group: "gh-pages-write"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contributor-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: contributor-docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Regenerates src/content/docs/{project,design,connectors,process}/**
      # from ROADMAP.md/ARCHITECTURE.md/docs/** — also runs automatically as
      # `npm run build`'s own prebuild step; done here explicitly so a stale
      # sync never gets built by accident. See scripts/sync-docs.mjs.
      - name: Build
        run: npm run build

      # Publishes into the contributor/ subfolder of the gh-pages branch
      # docs-site's own deploy-docs.yml publishes to the root of — the two
      # sites share one GitHub Pages deployment but stay in separate
      # subtrees. With target-folder set, this action only cleans stale
      # files within contributor/ itself, so it never touches docs-site's
      # content or pr-preview/; docs-site's own deploy still needs
      # contributor/ added to its clean-exclude so its root-level clean
      # doesn't wipe this out.
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: contributor-docs/dist
          branch: gh-pages
          target-folder: contributor
          force: false
