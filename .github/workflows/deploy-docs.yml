name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with every other workflow that writes to gh-pages
# (deploy-contributor-docs.yml, preview-docs.yml, preview-contributor-docs.yml)
# - JamesIves/github-pages-deploy-action pushes by fetching gh-pages,
# committing on top, and pushing, retrying a bounded number of times on a
# rejected (non-fast-forward) push. Two workflows publishing into different
# subfolders of the branch can still race for the same ref and exhaust that
# retry budget - confirmed the hard way (not assumed) when this workflow and
# deploy-contributor-docs.yml both fired for the same main push and this one
# lost after 3 rebase-and-retry attempts, leaving production docs-site
# undeployed. One shared group serializes every gh-pages write across all
# four workflows instead. cancel-in-progress: false, deliberately not true -
# with one shared group, "cancel" would mean an unrelated in-flight deploy
# (a different PR's preview, or the other site's production deploy) gets
# silently dropped rather than queued; every deploy here should still
# complete, just possibly after waiting its turn.
concurrency:
  group: "gh-pages-write"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Publishes to the gh-pages branch's root, which is what GitHub Pages
      # (configured under Settings > Pages to deploy from the gh-pages
      # branch) actually serves. clean-exclude protects pr-preview/, which
      # preview-docs.yml maintains on this same branch — without it, every
      # production deploy would wipe out every currently-open PR's preview.
      # contributor/ and contributor-pr-preview/ are protected the same
      # way: they belong to contributor-docs/'s own production
      # (deploy-contributor-docs.yml) and PR-preview
      # (preview-contributor-docs.yml) deploys — a separate site (see
      # CLAUDE.md's "Documentation Policy") — not something this job's
      # build produces.
      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs-site/dist
          branch: gh-pages
          clean-exclude: |
            pr-preview/
            contributor/
            contributor-pr-preview/
          force: false
