name: Dependency Graph

# Populates GitHub's native Dependency graph (Insights tab) with each sbt
# module's actually-resolved dependencies, which is what powers Dependabot
# alerts for this repo. GitHub's dependency graph doesn't parse build.sbt
# on its own (unlike pom.xml or package-lock.json) - without this, Dependabot
# silently sees zero Scala dependencies no matter what dependabot.yml says.
#
# Runs on push to main only, not on PRs: the dependency graph represents
# the current state of the default branch, and submitting a snapshot per
# PR branch would just create noise (see scalacenter/sbt-dependency-submission's
# own usage docs).
on:
  push:
    branches:
      - main

# scalacenter/sbt-dependency-submission POSTs a snapshot via GitHub's
# Dependency Submission API, which needs `contents: write` on the
# workflow's GITHUB_TOKEN - without this, every submission is rejected
# with "403 Resource not accessible by integration" regardless of the
# repo's own default token permissions (confirmed empirically: this
# workflow failed on every one of its runs since it was introduced,
# always at this exact step, until this permission was added).
permissions:
  contents: write

jobs:
  dependency-graph:
    name: Submit dependency graph (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kept in sync by hand with the module list in test.yml's `sbom`
        # job (and, transitively, dev/build's own dependency order) -
        # there's no single source of truth across the three, so a new
        # module added to one needs the same edit made in the others.
        module: [contract, ir, plugin, runner, spark-adapter, notification-kafka]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # spark-adapter and runner resolve contract/ir (and, for runner,
      # spark-adapter too) as real libraryDependencies against their
      # published coordinates, not unmanagedJars (see spark-adapter/
      # build.sbt's and runner/build.sbt's own comments) - each matrix leg
      # here is an independent job/checkout, so unlike dev/build's single
      # ordered run, this needs its own publishLocal of every such
      # dependency before the submission step can resolve them, the same
      # fix already applied to every spark-adapter-building job in
      # test.yml. No-op for contract/ir/plugin/notification-kafka, which
      # have no such dependency to publish first.
      - name: Publish local dependencies for ${{ matrix.module }}
        if: matrix.module == 'spark-adapter' || matrix.module == 'runner'
        run: |
          cd contract && sbt -batch publishLocal && cd ..
          cd ir && sbt -batch publishLocal && cd ..
          if [ "${{ matrix.module }}" = "runner" ]; then
            cd spark-adapter && sbt -batch publishLocal && cd ..
          fi

      - name: Submit ${{ matrix.module }} dependencies
        uses: scalacenter/sbt-dependency-submission@v3
        with:
          working-directory: ${{ matrix.module }}
          correlator: dependency-graph-${{ matrix.module }}
