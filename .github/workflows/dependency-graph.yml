name: Dependency Graph

# Populates GitHub's native Dependency graph (Insights tab) with each sbt
# module's actually-resolved dependencies, which is what powers Dependabot
# alerts for this repo. GitHub's dependency graph doesn't parse build.sbt
# on its own (unlike pom.xml or package-lock.json) - without this, Dependabot
# silently sees zero Scala dependencies no matter what dependabot.yml says.
#
# Runs on push to main (or by hand), not on PRs: the dependency graph represents
# the current state of the default branch, and submitting a snapshot per
# PR branch would just create noise (see scalacenter/sbt-dependency-submission's
# own usage docs).
on:
  push:
    branches:
      - main
  # by hand, to check a change to this workflow on a branch before it reaches main
  workflow_dispatch:

# scalacenter/sbt-dependency-submission POSTs a snapshot via GitHub's
# Dependency Submission API, which needs `contents: write` on the
# workflow's GITHUB_TOKEN - without this, every submission is rejected
# with "403 Resource not accessible by integration" regardless of the
# repo's own default token permissions (confirmed empirically: this
# workflow failed on every one of its runs since it was introduced,
# always at this exact step, until this permission was added).
permissions:
  contents: write

jobs:
  dependency-graph:
    name: Submit dependency graph (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every module in modules.json - .github/scripts/check_modules.py (CI's "Module registry
        # check") fails when this list and the registry disagree.
        module: [contract, ir, fingerprint, verification-core, adapter-testkit, plugin, runner, spark-adapter, beam-adapter, notification-kafka, registry-client]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Every module after contract resolves some of the engine modules (contract, ir, fingerprint, verification-core,
      # adapter-testkit) by their published coordinates, not unmanagedJars, and each matrix leg is its own checkout, so they are
      # published locally first - with the same cached action test.yml uses, which is a cache hit when they have not changed. It
      # runs for every leg rather than a hand-kept list of which module needs which: that list was missed when beam-adapter
      # joined the matrix, and its leg failed on every run from then on with "Error downloading com.invaract:invaract-contract_2.12".
      - name: Publish the engine modules locally
        uses: ./.github/actions/publish-engine-modules

      # runner also resolves spark-adapter
      - name: Publish spark-adapter locally (runner's dependency)
        if: matrix.module == 'runner'
        run: cd spark-adapter && sbt -batch publishLocal

      - name: Submit ${{ matrix.module }} dependencies
        uses: scalacenter/sbt-dependency-submission@v3
        with:
          working-directory: ${{ matrix.module }}
          correlator: dependency-graph-${{ matrix.module }}
