name: Test and Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

# One live run per pull request: a new push to the PR cancels the previous
# run instead of letting every push's full ~30-job run pile up behind it.
# Before this existed, 7 pushes to one PR branch inside an hour put roughly
# 230 jobs in the queue, and the latest run's jobs waited up to ~129 minutes
# for a runner (measured on PR #84). Push events (main, develop, feature/**)
# get a unique per-run group instead, so every commit on a long-lived branch
# still gets its own full run - a shared per-ref group would silently
# collapse queued runs for intermediate commits even with cancel-in-progress
# off.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on ${{ matrix.os }} / Java ${{ matrix.java-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['11', '17', '21']
        exclude:
          # Reduce matrix size: test all Java versions on Linux, others on default
          - os: macos-latest
            java-version: '11'
          - os: windows-latest
            java-version: '11'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'sbt'

      # actions/setup-java's cache: 'sbt' only caches sbt's own cache
      # directories — it doesn't install sbt itself. windows-latest ships
      # sbt preinstalled, which is why this gap wasn't obvious from that
      # leg alone; ubuntu-latest and macos-latest do not.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Run from inside a module directory, not the repo root: the sbt
      # launcher picks its actual sbt version from project/build.properties
      # in the current directory (each module pins its own sbt.version --
      # 1.9.8 for contract/plugin/runner, 1.11.7 for ir/spark-adapter, the
      # latter bumped for Stryker4s's minimum sbt requirement), and the
      # repo root has no project/ dir of its own (no aggregating root
      # build). Run at the repo root, it falls back to the newest sbt
      # release (2.x), which refuses to run on JDK <17 and broke this step
      # on every Java-11 leg.
      - name: Verify sbt installation
        run: cd plugin && sbt --version

      # Runner-provided $RUNNER_TEMP is writable without elevation on every
      # matrix OS, unlike /opt (root-owned on Linux/macOS, and `sudo`
      # doesn't exist at all on windows-latest's git-bash). Every job here
      # runs on a fresh runner, so the "already installed" branch this
      # replaced never actually took in practice.
      # Downloading + extracting Spark from archive.apache.org took over two
      # minutes per job (the single biggest cost in the whole matrix) and
      # ran fresh on every job of every run. Caching the extracted
      # directory across runs, keyed on OS + Spark version, turns that into
      # a cache restore (a few seconds) on every run after the first.
      - name: Cache Spark distribution
        id: cache-spark
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/spark
          key: spark-${{ runner.os }}-3.5.9-hadoop3

      - name: Download Spark 3.5.9
        if: steps.cache-spark.outputs.cache-hit != 'true'
        shell: bash
        # On windows-latest, $RUNNER_TEMP is a native path (D:\a\_temp\...).
        # git-bash's tar misparses the backslash-drive-letter form as an
        # old-style "host:path" remote archive spec ("tar (child): Cannot
        # connect to D: resolve failed") instead of a local path. Route it
        # through cygpath -u (bundled with Git for Windows) to get a POSIX
        # path everywhere; it's a no-op passthrough on Linux/macOS where
        # cygpath doesn't exist.
        run: |
          SPARK_VERSION="3.5.9"
          SPARK_PACKAGE="spark-${SPARK_VERSION}-bin-hadoop3"
          SPARK_URL="https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/${SPARK_PACKAGE}.tgz"

          if command -v cygpath &> /dev/null; then
            RUNNER_TEMP_POSIX="$(cygpath -u "$RUNNER_TEMP")"
          else
            RUNNER_TEMP_POSIX="$RUNNER_TEMP"
          fi
          SPARK_DIR="${RUNNER_TEMP_POSIX}/spark"

          echo "Installing Apache Spark 3.5.9..."
          curl -fsSL "$SPARK_URL" -o "${RUNNER_TEMP_POSIX}/spark.tgz"
          mkdir -p "$SPARK_DIR"
          tar -xzf "${RUNNER_TEMP_POSIX}/spark.tgz" -C "$SPARK_DIR" --strip-components=1
          rm -f "${RUNNER_TEMP_POSIX}/spark.tgz"

      - name: Configure Spark environment
        shell: bash
        # Runs regardless of cache hit/miss — SPARK_HOME/PATH need to be set
        # either way, and the extraction target is the same path the cache
        # step restores into.
        run: |
          if command -v cygpath &> /dev/null; then
            SPARK_DIR="$(cygpath -u "$RUNNER_TEMP")/spark"
          else
            SPARK_DIR="${RUNNER_TEMP}/spark"
          fi
          echo "SPARK_HOME=$SPARK_DIR" >> "$GITHUB_ENV"
          echo "$SPARK_DIR/bin" >> "$GITHUB_PATH"

      - name: Set up winutils.exe (Windows local-write support)
        if: runner.os == 'Windows'
        shell: bash
        # Hadoop's RawLocalFileSystem needs winutils.exe on Windows for any
        # local-disk write at all (it shells out to it for chmod-equivalent
        # permission calls) — Apache doesn't ship one. Pinned to a specific
        # commit of a long-maintained community mirror (cdarlint/winutils),
        # with checksums verified against what was downloaded and inspected
        # when this was added.
        #
        # Uses the 3.3.6 build, not 3.3.4-matching 3.3.5: 3.3.5's
        # winutils.exe links MSVCR100.dll (the VC++ 2010 runtime), which
        # GitHub's windows-latest images no longer ship, so it failed to
        # even start (Shell$ExitCodeException with no output — the process
        # never launched). 3.3.6 links the modern VCRUNTIME140.dll /
        # Universal CRT, which the runner images do carry.
        run: |
          set -e
          WINUTILS_REF="4c12f4040b8bb5ccc4b83938ce520602aea6c884"
          WINUTILS_BASE="https://raw.githubusercontent.com/cdarlint/winutils/$WINUTILS_REF/hadoop-3.3.6/bin"

          RUNNER_TEMP_POSIX="$(cygpath -u "$RUNNER_TEMP")"
          HADOOP_BIN="${RUNNER_TEMP_POSIX}/hadoop/bin"
          mkdir -p "$HADOOP_BIN"

          curl -fsSL "$WINUTILS_BASE/winutils.exe" -o "$HADOOP_BIN/winutils.exe"
          curl -fsSL "$WINUTILS_BASE/hadoop.dll" -o "$HADOOP_BIN/hadoop.dll"

          echo "496a591eb1e67df2a620f710d529ba6ddfe1c19149e6647cc4e320bb0efd8553  $HADOOP_BIN/winutils.exe" | sha256sum -c -
          echo "d7ab36a68518748cef142be2da5069b4c763c2cd764c1d2e6ac48c7200405be3  $HADOOP_BIN/hadoop.dll" | sha256sum -c -

          # HADOOP_HOME is read by Hadoop's own Java code (Shell.java)
          # directly, not just shell tooling, so — unlike PATH entries — it
          # needs to be a real Windows path: the JVM's File APIs don't
          # understand git-bash's POSIX form (/d/...) the way bash/tar/
          # cygpath-aware tools do.
          echo "HADOOP_HOME=$(cygpath -w "${RUNNER_TEMP_POSIX}/hadoop")" >> "$GITHUB_ENV"
          echo "$HADOOP_BIN" >> "$GITHUB_PATH"

      # spark-submit (bash script) calls `ps -o`, unsupported by git-bash's
      # ps on windows-latest — use Spark's native .cmd launcher there
      # instead (see dev/lib.sh's run_demo_job_harness for the same check).
      - name: Verify Spark installation
        shell: bash
        run: |
          if [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" ]] && command -v spark-submit.cmd &> /dev/null; then
            SPARK_HOME="$(cygpath -w "$SPARK_HOME")" spark-submit.cmd --version
          else
            spark-submit --version
          fi

      - name: Build all modules
        # dev/build compiles+tests+assembles contract, ir, plugin and
        # spark-adapter before runner, in that dependency order — contract/
        # ir/spark-adapter resolve each other as real libraryDependencies
        # (publishLocal'd by dev/build itself before the next module needs
        # them), plugin via unmanagedJars (harness-only, never published) -
        # see dev/build's own comments and spark-adapter/build.sbt's for the
        # full rationale. There's still no aggregating root build.sbt.
        # Building only plugin+runner here previously worked only by
        # accident when their jars happened to already exist; on a clean
        # checkout it fails runner's compile.
        run: ./dev/build
        shell: bash

      - name: Run contract regression pack
        # Exercises both the PASS case (a transformation that satisfies its
        # contract executes and writes its output) and the FAIL case (a
        # transformation that violates its contract is aborted by
        # ContractEnforcementRule before any output is written) against a
        # real spark-submit run — see dev/regression and
        # docs/SPARK_ADAPTER.md. SKIP_BUILD=1 because the previous step
        # already built every module's jar.
        run: SKIP_BUILD=1 ./dev/regression
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-java${{ matrix.java-version }}
          path: demo/output/*.json

  docker-regression:
    name: Contract regression pack (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Validates the same path a contributor with only Docker installed
      # takes via ./dev/regression-docker: build docker/Dockerfile (JDK 21,
      # sbt, Spark 3.5.9, every module built at image-build time) and run
      # it. docker run's exit code is dev/regression's — non-zero fails
      # this step, and therefore the job, exactly as a local run would.
      #
      # cache-from/to: type=gha caches Docker layers in GitHub's Actions
      # cache. The base image, apt-get, sbt-download, and Spark-download
      # layers all come before COPY . . in the Dockerfile, so they don't
      # depend on repo content at all — those (the network-bound layers)
      # get reused across virtually every build regardless of what
      # changed, even though the final `RUN ./dev/build` layer still
      # re-runs on any source change (it comes after COPY . .).
      - name: Build regression image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: invaract-regression
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run contract regression pack in Docker
        run: docker run --rm invaract-regression

  # Split into two parallel jobs (ir vs spark-adapter), not one sequential
  # job doing both: they're independent modules with independent test
  # suites - nothing about mutating one depends on the other finishing -
  # so serializing them on one runner was pure wasted wall-clock.
  # spark-adapter is by far the larger, slower module (Delta + Iceberg +
  # everything else); ir is comparatively small and has zero Spark
  # dependency at all (confirmed by grepping ir/build.sbt), so this also
  # lets ir's job skip the entire Spark cache/download/configure sequence
  # spark-adapter's job still needs. `--concurrency 4` on both `sbt
  # stryker` invocations below: Stryker4s's own concurrency setting
  # doesn't take effect via stryker4s.conf or build.sbt in this plugin
  # version (see spark-adapter/stryker4s.conf's comment), but - like
  # `--mutate`/`--thresholds` elsewhere in this file - it does work as an
  # explicit CLI flag, confirmed locally (log line "Creating 4
  # test-runners" vs. the config file's stuck-at-2 default). ubuntu-latest
  # runners have 4 vCPUs.
  mutation-testing-ir:
    name: Mutation testing (ir)
    runs-on: ubuntu-latest
    # One Linux/JDK-21 leg is enough: mutation testing measures test-suite
    # quality, not OS/JDK compatibility (that's what the `test` matrix is
    # for), so it doesn't need the full matrix. `sbt stryker` exits
    # non-zero when the module's score falls below its configured `break`
    # threshold (see ir/build.sbt) — that failure fails this job, which
    # `summary` below folds into the overall status.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      - name: Mutation test ir
        if: github.event_name != 'pull_request'
        shell: bash
        run: cd ir && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --concurrency 4"

      # See the shared comment on CLAUDE.md's "Mutation Testing
      # Requirement" / the base-commit-not-previous-push reasoning on the
      # spark-adapter job's equivalent step below - identical logic,
      # scoped to just this module.
      - name: Mutation test changed files (incremental, 70% bar)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          echo "Diffing against base commit: $BASE_SHA"

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- "ir/src/main/scala/" | grep '\.scala$' | sed "s|^ir/||" || true)

          if [ -z "$CHANGED" ]; then
            echo "=== ir: no changed files under src/main/scala, skipping ==="
          else
            FILE_COUNT=$(echo "$CHANGED" | wc -l)
            if [ "$FILE_COUNT" -eq 1 ]; then
              MUTATE_GLOB="$CHANGED"
            else
              MUTATE_GLOB="{$(echo "$CHANGED" | paste -sd, -)}"
            fi

            echo "=== ir: mutation-testing changed file(s) ==="
            echo "$CHANGED"
            (cd ir && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --mutate \"$MUTATE_GLOB\" --concurrency 4 --thresholds.high 90 --thresholds.low 80 --thresholds.break 70")
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-ir
          path: ir/target/stryker4s-report/**
          if-no-files-found: warn

  # fingerprint (docs/SEMANTIC_LINEAGE_FINGERPRINTING.md) gets the same
  # treatment as ir above, for the same reason: zero Spark dependency (its
  # only real dependency is ir itself - see fingerprint/build.sbt), so it
  # skips the Spark cache/download/configure sequence spark-adapter's job
  # needs, and its own whole-module Stryker run is small and fast enough
  # not to need spark-adapter's shard-per-runner split. This was a real,
  # tracked gap (CLAUDE.md's Mutation Testing Requirement: fingerprint
  # "carries the same Stryker4s settings ... but, unlike ir/spark-adapter,
  # is not yet wired into CI") - fingerprint has had `strykerThresholdsBreak
  # := 50` in its own build.sbt since the module was introduced, with
  # nothing in CI actually enforcing it until this job existed.
  mutation-testing-fingerprint:
    name: Mutation testing (fingerprint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # fingerprint's build.sbt resolves ir as a real libraryDependency
      # against its own published coordinate (no aggregating root
      # build.sbt, no unmanagedJars - see fingerprint/build.sbt's own
      # comment), so it needs `publishLocal` before `sbt stryker` can even
      # compile fingerprint's sources, let alone mutate them - the same
      # fix mutation-testing-spark-adapter's own equivalent step already
      # applies for contract/ir/fingerprint there.
      - name: Publish ir locally (fingerprint's libraryDependency)
        shell: bash
        run: cd ir && sbt publishLocal

      - name: Mutation test fingerprint
        if: github.event_name != 'pull_request'
        shell: bash
        run: cd fingerprint && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --concurrency 4"

      # See the shared comment on CLAUDE.md's "Mutation Testing
      # Requirement" / the base-commit-not-previous-push reasoning on the
      # spark-adapter job's equivalent step below - identical logic,
      # scoped to just this module.
      - name: Mutation test changed files (incremental, 70% bar)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          echo "Diffing against base commit: $BASE_SHA"

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- "fingerprint/src/main/scala/" | grep '\.scala$' | sed "s|^fingerprint/||" || true)

          if [ -z "$CHANGED" ]; then
            echo "=== fingerprint: no changed files under src/main/scala, skipping ==="
          else
            FILE_COUNT=$(echo "$CHANGED" | wc -l)
            if [ "$FILE_COUNT" -eq 1 ]; then
              MUTATE_GLOB="$CHANGED"
            else
              MUTATE_GLOB="{$(echo "$CHANGED" | paste -sd, -)}"
            fi

            echo "=== fingerprint: mutation-testing changed file(s) ==="
            echo "$CHANGED"
            (cd fingerprint && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --mutate \"$MUTATE_GLOB\" --concurrency 4 --thresholds.high 90 --thresholds.low 80 --thresholds.break 70")
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-fingerprint
          path: fingerprint/target/stryker4s-report/**
          if-no-files-found: warn

  # verification-core (docs/MULTI_ENGINE_ADAPTERS.md, Stage 2): the
  # engine-neutral verification code extracted from spark-adapter. It has no
  # Spark dependency, so - like ir and fingerprint above - it skips the Spark
  # cache/download sequence and runs on its own (fast) Spark-free suite, whole
  # module plus the PR-scoped incremental check. Its break threshold is the
  # one in verification-core/build.sbt.
  mutation-testing-verification-core:
    name: Mutation testing (verification-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # verification-core's build.sbt resolves contract, ir and fingerprint as
      # real libraryDependencies against their published coordinates (no
      # aggregating root build), so they must be published locally before
      # `sbt stryker` can even compile it - the shared action does that (and
      # caches it).
      - name: Publish contract, ir and fingerprint locally (verification-core's libraryDependencies)
        uses: ./.github/actions/publish-engine-modules

      - name: Mutation test verification-core
        if: github.event_name != 'pull_request'
        shell: bash
        run: cd verification-core && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --concurrency 4"

      # See the shared comment on CLAUDE.md's "Mutation Testing
      # Requirement" / the base-commit-not-previous-push reasoning on the
      # spark-adapter job's equivalent step below - identical logic,
      # scoped to just this module.
      - name: Mutation test changed files (incremental, 70% bar)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          echo "Diffing against base commit: $BASE_SHA"

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- "verification-core/src/main/scala/" | grep '\.scala$' | sed "s|^verification-core/||" || true)

          if [ -z "$CHANGED" ]; then
            echo "=== verification-core: no changed files under src/main/scala, skipping ==="
          else
            FILE_COUNT=$(echo "$CHANGED" | wc -l)
            if [ "$FILE_COUNT" -eq 1 ]; then
              MUTATE_GLOB="$CHANGED"
            else
              MUTATE_GLOB="{$(echo "$CHANGED" | paste -sd, -)}"
            fi

            echo "=== verification-core: mutation-testing changed file(s) ==="
            echo "$CHANGED"
            (cd verification-core && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --mutate \"$MUTATE_GLOB\" --concurrency 4 --thresholds.high 90 --thresholds.low 80 --thresholds.break 70")
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-verification-core
          path: verification-core/target/stryker4s-report/**
          if-no-files-found: warn

  # adapter-testkit (docs/MULTI_ENGINE_ADAPTERS.md, Stage 4): the conformance kit defines what
  # "conformant" means, so it is mutation-tested like the code it judges. Spark-free, fast suite
  # (the reference adapter), so like verification-core it runs whole-module on pushes and
  # incrementally on a PR. The break threshold is the one in adapter-testkit/build.sbt.
  mutation-testing-adapter-testkit:
    name: Mutation testing (adapter-testkit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # The kit's build.sbt resolves verification-core (and through it contract, ir and
      # fingerprint) as published libraryDependencies - the shared action publishes them.
      - name: Publish the engine modules locally (the kit's libraryDependencies)
        uses: ./.github/actions/publish-engine-modules

      - name: Mutation test adapter-testkit
        if: github.event_name != 'pull_request'
        shell: bash
        run: cd adapter-testkit && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --concurrency 4"

      - name: Mutation test changed files (incremental, 70% bar)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # Scenarios.scala is excluded from mutation (adapter-testkit/build.sbt says why: the injected code pushes its
          # object initialiser past the JVM method-size limit), and a --mutate on the command line overrides that
          # setting, so the file is dropped from the changed list here too.
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- "adapter-testkit/src/main/scala/" | grep '\.scala$' | grep -v 'testkit/Scenarios\.scala$' | sed "s|^adapter-testkit/||" || true)

          if [ -z "$CHANGED" ]; then
            echo "=== adapter-testkit: no changed files under src/main/scala, skipping ==="
          else
            FILE_COUNT=$(echo "$CHANGED" | wc -l)
            if [ "$FILE_COUNT" -eq 1 ]; then
              MUTATE_GLOB="$CHANGED"
            else
              MUTATE_GLOB="{$(echo "$CHANGED" | paste -sd, -)}"
            fi

            echo "=== adapter-testkit: mutation-testing changed file(s) ==="
            echo "$CHANGED"
            (cd adapter-testkit && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --mutate \"$MUTATE_GLOB\" --concurrency 4 --thresholds.high 90 --thresholds.low 80 --thresholds.break 70")
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-adapter-testkit
          path: adapter-testkit/target/stryker4s-report/**
          if-no-files-found: warn

  # spark-adapter's own whole-module Stryker run was, by itself, the real
  # CI bottleneck this repo had left to fix (docs/SPARK_ADAPTER.md's "CI
  # mutation-testing wall-clock" section explicitly flagged it as "what
  # this doesn't change" when ir/spark-adapter were split into separate
  # jobs: "~30-40 min ... genuine, unavoidable work" at the time, because
  # it ran every generated mutant, for every one of the module's 17
  # source files, sequentially on a single runner). Splitting it further
  # doesn't reduce that work (Stryker4s still reruns the full real-Spark
  # test suite once per mutant, same as before) - it parallelizes it: each
  # shard below runs `--mutate` scoped to a fixed subset of files (see
  # mutation-testing-spark-adapter's `matrix.include`), on its own runner, at
  # the same time as the others. `fail-fast: false` on the matrix means one
  # shard hitting a transient failure (a flaky Spark-session startup, a
  # runner hiccup) no longer takes the others down with it, and GitHub's
  # "re-run failed jobs" only has to redo that one shard instead of the
  # entire previous ~30-40 min monolith - the actual ask behind this split,
  # not just the wall-clock reduction.
  #
  # Measured wall-clock (the main run for the PR #81 merge, Oct 2026): shard-1
  # 66 min, shard-2 68 min, shard-4 72 min and - the outlier - the old
  # shard-3 152 min (171 mutants, "Mutation run finished! Took 2 hours, 23
  # minutes"). Splitting by source line count did not balance them: the old
  # shard-3 held about the same number of lines as the others (2800 vs
  # 2000-2661) yet took twice as long, because a mutant's cost is the number
  # (and weight) of tests that cover it, and the verifier / checkpoint code in
  # that shard sits on nearly every write path in the suite. Line count is
  # only a first guess at balance here. shard-3 was therefore split into
  # shard-3 (StructuralVerifier and two small files) and shard-5 (the other
  # five files), kept even by line count because no per-file timing existed
  # when that was done; re-tune from the per-file section of a shard's Stryker
  # HTML report (uploaded as the mutation-report-spark-adapter-<shard>
  # artifact) if one shard is still clearly the longest. The "~8-10 min per
  # shard" figure this comment used to quote was stale by roughly an order of
  # magnitude.
  #
  # Re-sharded from 5 to 10 legs, each at `--concurrency 2` instead of 4, to
  # stop runners being lost to memory exhaustion ("The runner has received a
  # shutdown signal", 5 of the last 12 main runs before this change). Measured
  # on a 4 vCPU / 16 GB machine, the same as ubuntu-latest, running the old
  # shard-3 files: 4 test runners peaked at ~10 GB used with the test JVM
  # heap already capped at 1 GB (build.sbt's Test / javaOptions; ~14 GB and
  # kernel OOM kills before the cap), 2 test runners at ~6 GB. (A local 15-minute
  # comparison suggested the two settings test mutants at about the same rate;
  # the first real CI run did not bear that out: the shards summed to ~505
  # runner-minutes against ~360 at --concurrency 4, i.e. about 1.4x the
  # compute, plus five more runners' setup.) File-to-shard assignment comes
  # from that run's measured shard times (93/85/69/63/51/45/37/22/20/20 min)
  # combined with the two earlier main runs' times for the old 5-way grouping,
  # fitted to per-file costs (non-negative least squares, line count as a weak
  # prior) and packed into 10 bins of ~40-50 min; StructuralVerifier (~90 min),
  # WriteCommandSupport (~63), ContractEnforcementRule (~50) and
  # SparkPlanAdapter (~48) each get a shard to themselves. StructuralVerifier
  # alone sets the wall-clock floor until it is split.
  # memwatch.sh prints per-30s memory/thread samples into each job's log
  # and rerun-on-runner-loss.yml re-runs a run whose only failures are lost
  # runners, once.
  #
  # Because Stryker4s's mutation score is a mutant-count-weighted average,
  # every shard clearing build.sbt's existing 70% break threshold on its
  # own subset is a *sufficient* condition for the whole module clearing
  # 70% overall (a weighted average of numbers that are each >= 70% is
  # itself >= 70%) - so gating each shard independently, with no CLI
  # threshold override needed, preserves the module-level guarantee
  # CLAUDE.md's "Mutation Testing Requirement" describes. It's actually a
  # bit stricter than the old single whole-module score: a shard that dips
  # locally below 70% now fails CI even if other shards' higher scores
  # would have pulled a single aggregate average back above the bar - the
  # same "a large, well-tested module can absorb a weakly-tested new file"
  # gap CLAUDE.md already calls out mutation testing as only partially
  # solving, narrowed a bit further for free.
  #
  # Sharding trades one long run for several shorter ones, each paying its
  # own setup cost - not free, but small next to the mutation work: measured
  # on shard-1 of that same run, everything before the Stryker step (JDK/sbt
  # setup, the Spark cache restore) took ~17 s and publishing contract/ir/
  # fingerprint locally took 1m44s, against a 63m44s mutation step. The Spark
  # distribution is cached (actions/cache, keyed on OS + version, same as the
  # `test` job above), sbt's own cache is warmed by actions/setup-java's
  # `cache: 'sbt'`, and the local publish is now restored from cache when
  # contract/ir/fingerprint are unchanged (see
  # .github/actions/publish-engine-modules). The mutation step itself also
  # includes Stryker's own initial full test run, which is not separately
  # timed in the step list.
  #
  # mutation-shard-drift-check (below) is the safety net for the one real
  # risk a hand-written, per-file shard list introduces: a new file added
  # to spark-adapter/src/main/scala that nobody assigns to a shard would
  # otherwise silently never get mutated at all, rather than failing loudly
  # the way an unassigned file should - the same class of silent-drift bug
  # version-matrix-drift-check already exists to catch for the Spark/Delta/
  # Iceberg version matrices.
  mutation-testing-spark-adapter:
    name: Mutation testing (spark-adapter, ${{ matrix.name }})
    runs-on: ubuntu-latest
    # Whole-module runs are for pushes (main/develop/feature/**), not PR pushes: the
    # incremental job below already enforces the 70% bar on exactly the files a PR
    # changes, and re-mutating every untouched file on every PR push cost ~50-90 min
    # of wall clock per push. A whole-module regression is caught on the merge
    # commit's push run instead (this job still gates that run via `summary`).
    if: github.event_name != 'pull_request'
    # Shards take 50-90 min. Without this the 360-minute default would let a hung runner
    # (or a Stryker run wedged on a stuck test JVM) hold a slot for six hours.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard-2
            files: "src/main/scala/com/invaract/sparkadapter/WriteCommandSupport.scala"
          - name: shard-3
            files: "src/main/scala/com/invaract/sparkadapter/ContractEnforcementRule.scala"
          - name: shard-4
            files: "src/main/scala/com/invaract/sparkadapter/SparkPlanAdapter.scala"
          - name: shard-5
            files: "src/main/scala/com/invaract/sparkadapter/CatalogIdentitySupport.scala,src/main/scala/com/invaract/sparkadapter/SparkAdapterListener.scala,src/main/scala/com/invaract/sparkadapter/SparkSchemas.scala,src/main/scala/com/invaract/sparkadapter/SparkConfigSource.scala,src/main/scala/com/invaract/sparkadapter/SparkCapabilities.scala"
          - name: shard-6
            files: "src/main/scala/com/invaract/sparkadapter/FailClosedCommands.scala,src/main/scala/com/invaract/sparkadapter/SparkFunctionAliases.scala,src/main/scala/com/invaract/sparkadapter/notification/HadoopFsNotificationSink.scala"
          - name: shard-8
            files: "src/main/scala/com/invaract/sparkadapter/RowMutationSupport.scala"
          - name: shard-9
            files: "src/main/scala/com/invaract/sparkadapter/CheckpointRegistry.scala"
          - name: shard-10
            files: "src/main/scala/com/invaract/sparkadapter/ContractSchemas.scala,src/main/scala/com/invaract/sparkadapter/DryRunReporter.scala,src/main/scala/com/invaract/sparkadapter/InvaractSparkSessionExtension.scala,src/main/scala/com/invaract/sparkadapter/StateChangingCallSupport.scala,src/main/scala/com/invaract/sparkadapter/VersionCompatibilityGuard.scala,src/main/scala/com/invaract/sparkadapter/registry/ContractSource.scala"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      - name: Cache Spark distribution
        id: cache-spark
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/spark
          key: spark-${{ runner.os }}-3.5.9-hadoop3

      - name: Download Spark 3.5.9
        if: steps.cache-spark.outputs.cache-hit != 'true'
        shell: bash
        run: |
          SPARK_VERSION="3.5.9"
          SPARK_PACKAGE="spark-${SPARK_VERSION}-bin-hadoop3"
          SPARK_URL="https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/${SPARK_PACKAGE}.tgz"
          SPARK_DIR="${RUNNER_TEMP}/spark"
          curl -fsSL "$SPARK_URL" -o "${RUNNER_TEMP}/spark.tgz"
          mkdir -p "$SPARK_DIR"
          tar -xzf "${RUNNER_TEMP}/spark.tgz" -C "$SPARK_DIR" --strip-components=1
          rm -f "${RUNNER_TEMP}/spark.tgz"

      - name: Configure Spark environment
        shell: bash
        run: |
          echo "SPARK_HOME=${RUNNER_TEMP}/spark" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/spark/bin" >> "$GITHUB_PATH"

      # spark-adapter's build.sbt resolves ir and contract as real
      # libraryDependencies against their own published coordinate (no
      # aggregating root build.sbt), so both need `publishLocal` before
      # `sbt stryker` can even compile spark-adapter's sources, let alone
      # mutate them.
      # spark-adapter's build.sbt resolves contract/ir as real
      # libraryDependencies against their own published coordinate (not
      # unmanagedJars — see spark-adapter/build.sbt's own comment on the
      # fix and why), so they need `publishLocal`, not just `assembly`,
      # before anything that compiles spark-adapter can resolve them.
      - name: Publish contract, ir, and fingerprint locally (spark-adapter's libraryDependencies)
        uses: ./.github/actions/publish-engine-modules

      # No --thresholds override here (unlike the incremental step below):
      # build.sbt's own strykerThresholdsHigh/Low/Break (90/80/70) already
      # apply to whatever --mutate scopes this run to, which is exactly
      # what makes per-shard gating at the module's real break threshold
      # work without duplicating it in the workflow.
      - name: Mutation test spark-adapter (${{ matrix.name }})
        shell: bash
        run: |
          cd spark-adapter
          "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --mutate \"{${{ matrix.files }}}\" --concurrency 2"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-spark-adapter-${{ matrix.name }}
          path: spark-adapter/target/stryker4s-report/**
          if-no-files-found: warn

  # The changed-files, 70%-on-new-code incremental check pulled out of the
  # (now sharded) whole-module job above into its own job: it doesn't share
  # anything with the shards - it always mutates only what a PR actually
  # touched, so it was never the source of the 30-40 min bottleneck the
  # sharding above addresses, and running it standalone lets it start
  # immediately in parallel with all of the shards instead of waiting in line
  # behind whichever shard it used to be bolted onto.
  mutation-testing-spark-adapter-incremental:
    name: Mutation testing (spark-adapter, incremental)
    runs-on: ubuntu-latest
    # Diffs against the PR's BASE commit, so it mutates every spark-adapter file the
    # whole PR has changed, in one job, with the full test suite per mutant. PR #92
    # (13 changed files, StructuralVerifier ~90 min and ContractEnforcementRule ~50
    # min of that alone) was cancelled by the 180-minute limit this job used to have
    # after running for 3 hours; the estimate for that file set is ~4 hours. 360 is
    # GitHub's maximum for a hosted runner. The whole-module shards above already
    # mutate the same files in parallel, so this is the slow, serial duplicate of
    # them - see docs/SPARK_ADAPTER.md for the options to shrink or fold it.
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      - name: Cache Spark distribution
        id: cache-spark
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/spark
          key: spark-${{ runner.os }}-3.5.9-hadoop3

      - name: Download Spark 3.5.9
        if: steps.cache-spark.outputs.cache-hit != 'true'
        shell: bash
        run: |
          SPARK_VERSION="3.5.9"
          SPARK_PACKAGE="spark-${SPARK_VERSION}-bin-hadoop3"
          SPARK_URL="https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/${SPARK_PACKAGE}.tgz"
          SPARK_DIR="${RUNNER_TEMP}/spark"
          curl -fsSL "$SPARK_URL" -o "${RUNNER_TEMP}/spark.tgz"
          mkdir -p "$SPARK_DIR"
          tar -xzf "${RUNNER_TEMP}/spark.tgz" -C "$SPARK_DIR" --strip-components=1
          rm -f "${RUNNER_TEMP}/spark.tgz"

      - name: Configure Spark environment
        shell: bash
        run: |
          echo "SPARK_HOME=${RUNNER_TEMP}/spark" >> "$GITHUB_ENV"
          echo "${RUNNER_TEMP}/spark/bin" >> "$GITHUB_PATH"

      # spark-adapter's build.sbt resolves contract/ir as real
      # libraryDependencies against their own published coordinate (not
      # unmanagedJars — see spark-adapter/build.sbt's own comment on the
      # fix and why), so they need `publishLocal`, not just `assembly`,
      # before anything that compiles spark-adapter can resolve them.
      - name: Publish contract, ir, and fingerprint locally (spark-adapter's libraryDependencies)
        uses: ./.github/actions/publish-engine-modules

      # CLAUDE.md's "Mutation Testing Requirement" asks for 70% on the
      # specific file(s) a feature adds or changes to ir/spark-adapter -
      # previously a manual step, since Stryker4s has no native
      # incremental/diff mode (see docs/SPARK_ADAPTER.md). This automates
      # it for PRs: diff against a base commit, scope --mutate to just the
      # changed .scala files (brace-expansion glob for multiple files -
      # confirmed to work locally), and override the whole-module break
      # threshold with a stricter 70% via CLI flags only, leaving
      # build.sbt's whole-module gate untouched. Runs only on pull_request
      # events, where a base commit is available - a bare push has no
      # equivalent reference point.
      #
      # The base commit is the PR's base branch (github.event.pull_request.
      # base.sha), not the previous push's HEAD. An earlier version of this
      # step used the previous push instead, reasoning that diffing against
      # the PR's base captures the *entire* PR's accumulated history, which
      # degenerates to "the whole module" for a long-lived, evolutionary PR
      # (confirmed the hard way - this exact PR's spark-adapter diff against
      # its base scored exactly 57.06%, identical to the whole-module score,
      # because this PR *is* the introduction of that module). That reasoning
      # was correct but the fix was wrong: diffing against the *previous
      # push* is a sliding baseline, and a sliding baseline can never durably
      # catch a regression that's introduced and then never fixed. Concretely:
      # if push N adds an undertested file and this check correctly fails,
      # then push N+1 - even one that touches nothing in that file - diffs
      # against N, where the same file already looks "unchanged" (nothing
      # differs between N and N+1), so the check passes even though the file
      # is exactly as undertested as when it failed. The bar silently stops
      # being enforced the moment CI reports it as met, whether or not
      # anything was actually fixed. A fixed base doesn't have this problem
      # (it only moves if the base branch itself advances, which is a
      # legitimate re-anchor, not a self-erasing one) - the "whole module"
      # degeneration for this specific long-lived PR is real but harmless
      # (redundant with the whole-module check above, not unsound), so it's
      # the correct tradeoff.
      - name: Mutation test changed files (incremental, 70% bar)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          echo "Diffing against base commit: $BASE_SHA"

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- "spark-adapter/src/main/scala/" | grep '\.scala$' | sed "s|^spark-adapter/||" || true)

          if [ -z "$CHANGED" ]; then
            echo "=== spark-adapter: no changed files under src/main/scala, skipping ==="
          else
            FILE_COUNT=$(echo "$CHANGED" | wc -l)
            if [ "$FILE_COUNT" -eq 1 ]; then
              MUTATE_GLOB="$CHANGED"
            else
              MUTATE_GLOB="{$(echo "$CHANGED" | paste -sd, -)}"
            fi

            echo "=== spark-adapter: mutation-testing changed file(s) ==="
            echo "$CHANGED"
            (cd spark-adapter && "$GITHUB_WORKSPACE/.github/scripts/memwatch.sh" -- sbt "stryker --mutate \"$MUTATE_GLOB\" --concurrency 2 --thresholds.high 90 --thresholds.low 80 --thresholds.break 70")
          fi

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-spark-adapter-incremental
          path: spark-adapter/target/stryker4s-report/**
          if-no-files-found: warn

  mutation-shard-drift-check:
    name: Mutation shard drift check
    runs-on: ubuntu-latest
    # Companion to version-matrix-drift-check further down: that job
    # catches a version claim drifting from what's actually tested, this
    # one catches a spark-adapter source file drifting from
    # mutation-testing-spark-adapter's hand-written per-shard `files` lists
    # above. Parses this workflow file's own YAML the same way
    # version-matrix-drift-check does (regex-isolate the job block, pull
    # every matrix entry's values out of it) rather than maintaining a
    # second, separate list of files somewhere else that could itself drift
    # from the matrix - the workflow file is the one source of truth for
    # which files each shard covers.
    #
    # Fails on any file under spark-adapter/src/main/scala not claimed by
    # exactly one shard: zero shards means a new file silently never gets
    # mutated at all (the actual failure mode this guards against); more
    # than one means the same mutants get generated and killed twice for no
    # benefit, at real wall-clock cost, on whichever shard runs longest.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare mutation-testing-spark-adapter's shard file lists against real spark-adapter sources
        shell: python3 {0}
        run: |
          import re
          import subprocess
          import sys

          workflow_path = ".github/workflows/test.yml"
          with open(workflow_path) as f:
              text = f.read()

          job_match = re.search(
              r"(?m)^  mutation-testing-spark-adapter:\n(.*?)(?=^  [A-Za-z0-9_-]+:\n|\Z)",
              text,
              re.S,
          )
          if not job_match:
              sys.exit("Could not find job 'mutation-testing-spark-adapter' in workflow")
          block = job_match.group(1)

          shard_file_lists = re.findall(r'files:\s*"([^"]*)"', block)
          if not shard_file_lists:
              sys.exit("Could not find any shard 'files' entries in job 'mutation-testing-spark-adapter'")

          claimed = []
          for shard in shard_file_lists:
              claimed.extend(f.strip() for f in shard.split(",") if f.strip())

          duplicates = sorted({f for f in claimed if claimed.count(f) > 1})
          if duplicates:
              sys.exit(f"DRIFT: file(s) claimed by more than one mutation-testing shard: {duplicates}")

          claimed_set = set(claimed)

          actual = subprocess.run(
              ["git", "ls-files", "spark-adapter/src/main/scala"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.splitlines()
          actual_set = {p[len("spark-adapter/"):] for p in actual if p.endswith(".scala")}

          missing = sorted(actual_set - claimed_set)
          stale = sorted(claimed_set - actual_set)

          drifted = False
          if missing:
              drifted = True
              print(f"DRIFT: file(s) under spark-adapter/src/main/scala not assigned to any mutation-testing shard: {missing}")
          if stale:
              drifted = True
              print(f"DRIFT: mutation-testing shard references file(s) that no longer exist: {stale}")

          if drifted:
              sys.exit(1)
          print(f"No drift: all {len(actual_set)} spark-adapter source file(s) are assigned to exactly one mutation-testing shard.")

  # Decides whether the Spark/Delta/Iceberg version-compatibility matrices run. They
  # prove spark-adapter's translation holds across Spark/Delta/Iceberg releases, so a
  # PR that touches neither spark-adapter, verification-core nor this workflow (docs,
  # harness, web, CI scripts, ...) cannot change their answer. Push events (main,
  # develop, feature/**) always run them, so nothing merges without a full run.
  changes:
    name: Detect engine changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.detect.outputs.engine }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff against the PR base
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: version matrices always run."
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- contract ir fingerprint verification-core adapter-testkit spark-adapter .github/workflows/test.yml .github/actions)
          if [ -n "$CHANGED" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "Engine files changed, version matrices will run:"
            echo "$CHANGED"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "No engine module (contract, ir, fingerprint, verification-core, adapter-testkit, spark-adapter) or workflow change: version matrices skipped."
          fi

  spark-version-matrix:
    name: Spark version compatibility (spark-adapter, ${{ matrix.spark-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # This is the "multi-Spark-version compatibility matrix" ROADMAP.md and
    # CLAUDE.md's "Supporting Multiple Spark Versions" section named as
    # still-outstanding: proof that spark-adapter's own suite actually
    # passes against more than the single Spark patch its build.sbt happens
    # to be pinned to, catching Catalyst plan-shape drift across patches
    # the adapter would otherwise silently mistranslate. Scoped to
    # spark-adapter's own `sbt test` (not the full 5-module ./dev/test
    # harness, which stays pinned to one real Spark runtime by design) and
    # to the Spark 3.5.x line specifically (the currently-supported floor -
    # see docs/SPARK_ADAPTER.md's "Spark version compatibility" section for
    # why a 4.x line is out of scope here).
    #
    # No Spark binary install here, unlike `test`/`mutation-testing-spark-
    # adapter`/`docker-regression` above: those exist to run real
    # spark-submit against DemoJobHarness, which does need SPARK_HOME on
    # PATH. This job only runs spark-adapter's own sbt test suite, which
    # resolves Spark as an ordinary managed dependency (the `provided`/
    # `test`-scope `sparkVersion` val in spark-adapter/build.sbt, now
    # overridable via INVARACT_TEST_SPARK_VERSION below) and spins up its
    # own in-process `local[*]` SparkSession - confirmed via a repo-wide
    # search that no spark-adapter source references SPARK_HOME, so a real
    # Spark distribution on PATH is not something this suite needs.
    # 3.5.6, not 3.5.1: an initial attempt at 3.5.1 as the floor failed with
    # a real ClassNotFoundException (org.apache.spark.sql.catalyst.plans.
    # logical.SupportsNonDeterministicExpression) inside
    # DeltaSparkSessionExtension whenever a spec builds a Delta-extended
    # session - confirmed via a real CI run, not assumed. delta-spark 3.3.3
    # (spark-adapter/build.sbt's pinned version) is only built against
    # Spark 3.5.6+ (see that file's own delta-version comment, which
    # already documented this before the matrix existed to prove it: "3.3.3
    # against 3.5.6 - the closest published delta-spark release"). 3.5.6 is
    # the real, evidenced floor for this module's full suite, not 3.5.1.
    strategy:
      fail-fast: false
      matrix:
        spark-version: ["3.5.6", "3.5.7", "3.5.9"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # spark-adapter's build.sbt resolves ir and contract as real
      # libraryDependencies against their own published coordinate (no
      # aggregating root build.sbt), so both need `publishLocal` first,
      # same as the mutation-testing job above. These are Spark-version-
      # independent (contract/ir have no Spark dependency at all), so each
      # matrix leg gets them from the shared publish-engine-modules action:
      # restored from the Actions cache when contract/ir/fingerprint are
      # unchanged, published otherwise (~1m45s measured). A cache rather than
      # a cross-job artifact hand-off, because a hand-off would put a serial
      # prerequisite job in front of every leg without shortening the run.
      # spark-adapter's build.sbt resolves contract/ir as real
      # libraryDependencies against their own published coordinate (not
      # unmanagedJars — see spark-adapter/build.sbt's own comment on the
      # fix and why), so they need `publishLocal`, not just `assembly`,
      # before anything that compiles spark-adapter can resolve them.
      - name: Publish contract, ir, and fingerprint locally (spark-adapter's libraryDependencies)
        uses: ./.github/actions/publish-engine-modules

      - name: Test spark-adapter against Spark ${{ matrix.spark-version }}
        shell: bash
        env:
          INVARACT_TEST_SPARK_VERSION: ${{ matrix.spark-version }}
        run: cd spark-adapter && sbt test

  delta-version-matrix:
    name: Delta Lake version compatibility (spark-adapter, ${{ matrix.delta-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # The connector-library counterpart to spark-version-matrix above: that
    # job proves spark-adapter's translation holds across Spark patches;
    # this one proves it holds across delta-spark releases specifically,
    # since spark-adapter/build.sbt only ever pinned one at a time (3.2.0,
    # then 3.3.3) and never had CI evidence either still works against the
    # other. See docs/connectors/delta.md's "Version compatibility" section
    # for the full rationale, including why 3.2.x is excluded (a known
    # Spark-side incompatibility unrelated to the Delta version itself, not
    # something this matrix is built to answer) and why there's no "newer"
    # leg (delta-spark_2.12's own maven-metadata.xml confirms 3.3.3 is
    # already the latest published release).
    #
    # Scoped to `testOnly` against the three specs that actually build a
    # Delta-extended session (ContractEnforcementRuleSpec,
    # SparkAdapterListenerSpec, SparkPlanAdapterSpec) rather than the full
    # `sbt test` spark-version-matrix runs: Delta has no dedicated spec
    # file, and a full-suite rerun per Delta version would spend most of
    # its ~30-40 minutes on code no Delta-version change can affect.
    #
    # Single-leg matrix, not a guess: this job's first real run tried
    # 3.3.0 as a floor candidate and it failed with the exact same "Table
    # ... does not support truncate in batch mode" TableCapabilityCheck
    # error that excluded the 3.2.x line. Checked delta-io/delta's own
    # LATEST_RELEASED_SPARK_VERSION constant at each 3.3.x tag directly
    # (not assumed): 3.3.0/3.3.1/3.3.2 all target Spark 3.5.3 - only 3.3.3
    # moved to 3.5.6. So 3.3.3 isn't just the current pin, it's currently
    # the *only* delta-spark release compatible with this repo's Spark
    # floor at all - there is no second version to matrix against today.
    # Kept as its own job (not folded back into a single sbt test run)
    # so it gains a second leg for free the moment delta-io publishes a
    # release that also targets Spark 3.5.6+.
    strategy:
      fail-fast: false
      matrix:
        delta-version: ["3.3.3"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # spark-adapter's build.sbt resolves contract/ir as real
      # libraryDependencies against their own published coordinate (not
      # unmanagedJars — see spark-adapter/build.sbt's own comment on the
      # fix and why), so they need `publishLocal`, not just `assembly`,
      # before anything that compiles spark-adapter can resolve them.
      - name: Publish contract, ir, and fingerprint locally (spark-adapter's libraryDependencies)
        uses: ./.github/actions/publish-engine-modules

      - name: Test spark-adapter's Delta specs against delta-spark ${{ matrix.delta-version }}
        shell: bash
        env:
          INVARACT_TEST_DELTA_VERSION: ${{ matrix.delta-version }}
        run: |
          cd spark-adapter
          sbt "testOnly *ContractEnforcementRuleSpec *SparkAdapterListenerSpec *SparkPlanAdapterSpec"

  iceberg-version-matrix:
    name: Iceberg version compatibility (spark-adapter, ${{ matrix.iceberg-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    # Same rationale as delta-version-matrix above, for Iceberg. See
    # docs/connectors/iceberg.md's "Version compatibility" section for why
    # 1.10.0 is excluded (a real, known Avro-API bug inside that release
    # itself, apache/iceberg#14232 - deliberately not used as an
    # expected-failure regression-proof leg here, to keep this job the
    # same shape as every other matrix job: every leg expected to pass, no
    # special-case failure handling) and why there's no "newer" leg
    # (iceberg-spark-runtime-3.5_2.12's own maven-metadata.xml confirms
    # 1.11.0 is already the latest published release).
    #
    # Scoped to `testOnly` against the three specs that actually reference
    # Iceberg (IcebergConnectorSpec, SparkAdapterListenerIcebergSpec,
    # MultiCatalogQualifierSpec) - spark-adapter/build.sbt's own JDK17+
    # exclusion-filter comment already confirms these are the only
    # Iceberg-dependent test sources. Runs on JDK 21 (set up below),
    # satisfying Iceberg's own JDK17+ class-file-version requirement with
    # no extra gating needed.
    #
    # 1.9.2 (latest patch of the prior 1.9.x minor line) was tried as a
    # candidate leg to push the verified floor down one step below 1.10.2,
    # mirroring exactly how 1.10.2 itself was chosen - and failed for real:
    # IcebergConnectorSpec's JdbcCatalog-backed tests hit a genuine bug in
    # 1.9.2's own JdbcCatalog.initializeCatalogTables (a lowercase-only
    # table-existence check that misses H2's uppercase-folded table name,
    # so it tries to re-create an already-existing table and H2 rejects
    # it) - fixed in 1.10.2's atomicCreateTable. See docs/connectors/
    # iceberg.md's "Version compatibility" section, "Investigated and
    # rejected: 1.9.2" for the full root-cause comparison of both
    # versions' real source. 1.10.2 stays the floor; not re-added here.
    strategy:
      fail-fast: false
      matrix:
        iceberg-version: ["1.10.2", "1.11.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # spark-adapter's build.sbt resolves contract/ir as real
      # libraryDependencies against their own published coordinate (not
      # unmanagedJars — see spark-adapter/build.sbt's own comment on the
      # fix and why), so they need `publishLocal`, not just `assembly`,
      # before anything that compiles spark-adapter can resolve them.
      - name: Publish contract, ir, and fingerprint locally (spark-adapter's libraryDependencies)
        uses: ./.github/actions/publish-engine-modules

      - name: Test spark-adapter's Iceberg specs against iceberg-spark-runtime ${{ matrix.iceberg-version }}
        shell: bash
        env:
          INVARACT_TEST_ICEBERG_VERSION: ${{ matrix.iceberg-version }}
        run: |
          cd spark-adapter
          sbt "testOnly *IcebergConnectorSpec *SparkAdapterListenerIcebergSpec *MultiCatalogQualifierSpec"

  version-matrix-drift-check:
    name: Version matrix drift check
    runs-on: ubuntu-latest
    # spark-adapter/src/main/resources/supported-versions.properties is the
    # single canonical claim of which Spark/Delta/Iceberg versions this repo
    # has real CI evidence for (build.sbt's defaults, the runtime
    # compatibility guard, and the generated docs tables all read it - see
    # that file's own header comment). The three *-version-matrix jobs above
    # stay hand-written strategy.matrix arrays rather than being generated
    # from that file (lowest-risk choice: they already work, and a dynamic
    # fromJSON()-driven matrix would restructure proven jobs for marginal
    # benefit) - which means nothing stops the two from silently disagreeing.
    # That's not hypothetical: this session already found and fixed a stale
    # hand-copied version claim twice before this file existed. This job
    # fails CI the moment supported-versions.properties claims a "verified"
    # version that isn't actually exercised by the matching *-version-matrix
    # job's own array, so a doc claiming CI evidence it doesn't have is a
    # same-PR failure instead of a quietly stale claim.
    #
    # One-directional (verified ⊆ matrix), not exact-set equality: a matrix
    # job's array is allowed to carry a *candidate* version supported-
    # versions.properties doesn't claim yet - that's exactly the real
    # workflow used to find this repo's actual Spark/Delta floors (a
    # version is added to the matrix first, proven or disproven by a real
    # CI run, and only then promoted into the properties file - see
    # docs/connectors/iceberg.md's "Version compatibility" section for the
    # Iceberg case this was written for). Exact equality would make that
    # workflow impossible post-this-job: the moment you added an
    # unproven candidate leg to try it out, this check would fail before
    # the real Iceberg job even got a chance to run.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compare supported-versions.properties against this workflow's matrix arrays
        shell: python3 {0}
        run: |
          import re
          import sys

          def parse_properties(path):
              values = {}
              with open(path) as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, _, value = line.partition("=")
                      values[key.strip()] = [v for v in value.strip().split(",") if v]
              return values

          def parse_matrix(path, job, key):
              with open(path) as f:
                  text = f.read()
              # Isolate the named job's block (up to the next top-level - 2-space
              # indented - job key) so this can't accidentally match another
              # job's matrix array of the same key name.
              job_match = re.search(rf"(?m)^  {re.escape(job)}:\n(.*?)(?=^  [A-Za-z0-9_-]+:\n|\Z)", text, re.S)
              if not job_match:
                  sys.exit(f"Could not find job '{job}' in {path}")
              block = job_match.group(1)
              array_match = re.search(rf"{re.escape(key)}:\s*\[([^\]]*)\]", block)
              if not array_match:
                  sys.exit(f"Could not find matrix key '{key}' in job '{job}' in {path}")
              return [v.strip().strip('"') for v in array_match.group(1).split(",") if v.strip()]

          props = parse_properties("spark-adapter/src/main/resources/supported-versions.properties")
          workflow_path = ".github/workflows/test.yml"

          checks = [
              ("spark", "spark-version-matrix", "spark-version"),
              ("delta", "delta-version-matrix", "delta-version"),
              ("iceberg", "iceberg-version-matrix", "iceberg-version"),
          ]

          drifted = False
          for prop_prefix, job, key in checks:
              expected = set(props.get(f"{prop_prefix}.verified", []))
              actual = set(parse_matrix(workflow_path, job, key))
              missing = expected - actual
              if missing:
                  drifted = True
                  print(f"DRIFT in {prop_prefix}: supported-versions.properties claims {sorted(missing)} as "
                        f"verified, but {job}'s {key} matrix ({sorted(actual)}) doesn't test it")
              primary_key = f"{prop_prefix}.primary"
              primary = props.get(primary_key, [None])[0]
              if primary not in expected:
                  drifted = True
                  print(f"DRIFT in {prop_prefix}: {primary_key}={primary} is not in its own 'verified' list {sorted(expected)}")

          if drifted:
              sys.exit(1)
          print("No drift: every version supported-versions.properties claims as verified is exercised by its *-version-matrix job.")

  docs-drift-check:
    name: Version docs drift check
    runs-on: ubuntu-latest
    # dev/generate-version-docs regenerates the "Supported versions"
    # sections of docs-site/src/content/docs/reference/spark-version-
    # support.mdx, connector-support.mdx, and docs/COMPATIBILITY.md from
    # supported-versions.properties (see that file's own header comment,
    # and dev/generate-version-docs's own comment for the exact scope - the
    # investigative prose around each table stays hand-written, only the
    # version enumeration and status badges are generated). This job runs
    # unconditionally, the same as version-matrix-drift-check above, rather
    # than being folded into deploy-docs.yml/preview-docs.yml: those only
    # trigger on pushes that touch docs-site/ itself, so a change to
    # supported-versions.properties alone (with no docs-site/ edit in the
    # same push) would never be checked there - exactly the drift this job
    # exists to catch.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check generated version docs are up to date
        shell: bash
        run: ./dev/generate-version-docs --check

  # Unit tests for the scripts CI itself runs: runner_loss.py (decides whether a failed run is
  # re-run by rerun-on-runner-loss.yml - a wrong answer would either hide a real failure behind a
  # lucky re-run or leave a runner loss red) and memwatch.sh (wraps every mutation job; a bug here
  # would break those jobs' exit status).
  workflow-scripts:
    name: Workflow script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Unit-test runner_loss.py
        shell: bash
        run: cd .github/scripts && python3 -m unittest -v test_runner_loss

      # modules.json is the one list of the repository's sbt modules; every file that keeps its own
      # (the CI loops, the release steps, dev/build, the warm-up list, the dependency graph, the mutation
      # jobs) must agree with it, and each adapter must run the conformance kit. See check_modules.py.
      - name: Unit-test check_modules.py and dev/new-adapter
        shell: bash
        run: cd .github/scripts && python3 -m unittest -v test_check_modules test_new_adapter

      - name: Module registry check (modules.json against every file that lists modules)
        shell: bash
        run: python3 .github/scripts/check_modules.py

      - name: memwatch.sh passes the wrapped command's exit status through
        shell: bash
        run: |
          bash -n .github/scripts/memwatch.sh
          .github/scripts/memwatch.sh --interval 1 -- bash -c 'exit 0'
          set +e
          .github/scripts/memwatch.sh --interval 1 -- bash -c 'exit 7'
          status=$?
          set -e
          test "$status" -eq 7 || { echo "expected exit status 7, got $status"; exit 1; }

  adapter-scaffold-check:
    name: Adapter scaffold check (dev/new-adapter builds and passes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # dev/new-adapter generates the skeleton a new engine adapter starts from (docs/ADDING_AN_ENGINE_ADAPTER.md).
    # A template nobody builds rots: it would drift from the kit's API or the sibling modules' versions and
    # then fail the first person who used it. So every run generates a skeleton into a scratch directory
    # (without registering it) and builds and tests it against the modules as they are now. As generated, every
    # capability is declared unsupported, so every conformance scenario is canceled and the build passes; what
    # fails here is a template that no longer compiles.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      - name: Publish the engine modules and the conformance kit locally
        uses: ./.github/actions/publish-engine-modules

      - name: Generate a skeleton
        shell: bash
        run: python3 dev/new-adapter scaffoldcheck --display ScaffoldCheck --out "$RUNNER_TEMP/scaffold"

      - name: Build and test the skeleton
        shell: bash
        run: cd "$RUNNER_TEMP/scaffold/scaffoldcheck-adapter" && sbt test

  api-compatibility:
    name: API compatibility (contract, ir, fingerprint, verification-core, spark-adapter)
    runs-on: ubuntu-latest
    # MiMa (sbt-mima-plugin) needs a previously *published* artifact to
    # diff the current build against, and there's no Maven Central release
    # of contract/ir/spark-adapter yet to compare to. Rather than skip the
    # check entirely until a real release exists, this job publishes base-
    # ref's build to the local Ivy cache first, then runs
    # `sbt mimaReportBinaryIssues` against the PR's head - "did this push
    # break binary compatibility with its own base branch." Only
    # meaningful with a base to diff against, so PR-only.
    #
    # The comparison jar is the one the base ref's own build published, found via the version
    # read off base-ref's checked-out build.sbt (the steps below). A module's hardcoded
    # `mimaPreviousArtifacts` literal is therefore only a local-development fallback: it can no
    # longer go stale and break CI, and a flip-it-in-a-follow-up-PR step no longer exists.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7

      # A fixed base (the PR's base branch), not a sliding one. An earlier
      # version of this job diffed against the PREVIOUS PUSH's HEAD
      # (github.event.before) instead, to work around this exact PR (#1)
      # having been open since before contract/ir/spark-adapter existed at
      # all - github.event.pull_request.base.sha resolves to the repo's
      # literal first commit, and base-ref/contract simply didn't exist
      # there ("No such file or directory", confirmed the hard way on this
      # job's first real run). That fix traded one bug for a worse one: a
      # sliding baseline can never durably catch a regression that's
      # introduced and then never fixed - if push N breaks compatibility
      # and this job correctly fails, push N+1 (even one that touches
      # nothing relevant) diffs against N, where the break already looks
      # like the status quo, so the check passes clean without anything
      # having been fixed. The real fix for the original problem is below:
      # skip a module gracefully if it didn't exist yet at the (fixed) base
      # commit, rather than changing which commit counts as the base.
      - name: Checkout PR base ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-ref

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # The base ref's modules are published into an ISOLATED Ivy home, the PR head's into the
      # default one. They used to share one cache, so a module whose dependency set changed had to
      # take a new version even with no code change, or whichever publish ran last clobbered the
      # other's POM (the 0.2.0 -> 0.3.0 style bumps in fingerprint/verification-core/adapter-testkit).
      # With two Ivy homes the base ref resolves only base coordinates, the head only head ones, and a
      # version bump is needed only when the version should change. MiMa is then pointed at the base
      # ref's jar directly (`mimaPreviousClassfiles`), so it can never resolve the head's own
      # artifact under an unchanged coordinate and compare the head with itself.
      #
      # Order is the dependency order: contract, ir, fingerprint (needs ir), verification-core (needs
      # all three), adapter-testkit (needs verification-core), spark-adapter (needs everything,
      # the kit as a test dependency). A module absent at the base commit has no prior public API to
      # be compatible with, so it is skipped rather than treated as "broke everything" - the normal
      # case for the PR that introduces a module.
      - name: Publish the base ref's modules to an isolated Ivy home
        shell: bash
        run: |
          BASE_IVY="$RUNNER_TEMP/ivy-base"
          mkdir -p "$BASE_IVY"
          for module in contract ir fingerprint verification-core adapter-testkit spark-adapter; do
            if [ ! -d "base-ref/$module" ]; then
              echo "=== $module: did not exist at the PR's base commit, skipping ==="
              continue
            fi
            echo "=== $module: publishing the base ref's build to $BASE_IVY ==="
            (cd "base-ref/$module" && sbt -Dsbt.ivy.home="$BASE_IVY" publishLocal)
          done

      - name: Check API compatibility for each module that existed at the base commit
        shell: bash
        run: |
          BASE_IVY="$RUNNER_TEMP/ivy-base"
          for module in contract ir fingerprint verification-core adapter-testkit spark-adapter; do
            if [ ! -d "base-ref/$module" ]; then
              echo "=== $module: did not exist at the PR's base commit, nothing to compare ==="
            else
              # The base ref's own version, read off its checked-out build.sbt: the exact
              # coordinate the publish step above used.
              BASE_VERSION=$(grep -oP '(?<=ThisBuild / version := ")[^"]+' "base-ref/$module/build.sbt" | head -1)
              if [ -z "$BASE_VERSION" ]; then
                echo "::error::Could not read ThisBuild / version from base-ref/$module/build.sbt"
                exit 1
              fi
              JAR="$BASE_IVY/local/com.invaract/invaract-${module}_2.12/$BASE_VERSION/jars/invaract-${module}_2.12.jar"
              if [ ! -f "$JAR" ]; then
                echo "::error::Expected the base ref's published jar at $JAR"
                exit 1
              fi
              echo "=== $module: checking the PR head against the base ref's $BASE_VERSION ==="
              # A real binary-incompatible change fails here with the offending symbol and a
              # ready-to-paste ProblemFilters.exclude(...) line for a deliberate, documented
              # exception - CLAUDE.md's "API Compatibility Requirement".
              (cd "$module" && sbt "set mimaPreviousClassfiles := Map((\"com.invaract\" % \"invaract-${module}_2.12\" % \"$BASE_VERSION\") -> file(\"$JAR\"))" mimaReportBinaryIssues)
            fi

            # The PR head's own build, for the modules after it (spark-adapter is last: nothing
            # resolves it). Also the case for a module new in this PR.
            if [ "$module" != "spark-adapter" ]; then
              echo "=== $module: publishing the PR head's build to the default Ivy home ==="
              (cd "$module" && sbt publishLocal)
            fi
          done

  coverage-gating:
    name: Coverage gating (contract, ir, fingerprint, verification-core, spark-adapter)
    runs-on: ubuntu-latest
    # Line/branch coverage (sbt-scoverage), the one guardrail CLAUDE.md's
    # Testing Strategy section had disclosed as still outstanding - a
    # different, complementary question from mutation testing's own "does
    # this code have tests that would catch a change": "does this code have
    # tests at all." Each module's build.sbt carries its own
    # coverageMinimumStmtTotal/coverageMinimumBranchTotal, measured against
    # its real suite and pinned a few points below (see ir/build.sbt's own
    # comment for the "measure first, then pin" discipline, the same one
    # strykerThresholdsBreak already follows) - coverageFailOnMinimum there
    # is what actually fails this job below threshold, not anything here.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # Dependency order, same as api-compatibility's own loop: contract/ir
      # have no cross-module dependency, fingerprint depends on ir alone,
      # spark-adapter depends on all three as real libraryDependencies.
      # Every publishLocal here is a PLAIN build (coverage NOT enabled) -
      # a downstream module must compile and run against the real,
      # uninstrumented artifact its own users would get, not a scoverage-
      # instrumented one, and mixing instrumented bytecode into a
      # dependency would also pollute the downstream module's own coverage
      # measurement with classes that aren't its.
      - name: Publish ir locally (fingerprint's/spark-adapter's libraryDependency)
        run: cd ir && sbt publishLocal

      - name: Publish contract locally (spark-adapter's libraryDependency)
        run: cd contract && sbt publishLocal

      - name: Publish fingerprint locally (spark-adapter's libraryDependency)
        run: cd fingerprint && sbt publishLocal

      - name: Publish verification-core locally (spark-adapter's libraryDependency)
        run: cd verification-core && sbt publishLocal

      - name: Publish adapter-testkit locally (spark-adapter's test dependency)
        run: cd adapter-testkit && sbt publishLocal

      - name: Coverage gate each module
        shell: bash
        run: |
          for module in contract ir fingerprint verification-core adapter-testkit spark-adapter; do
            echo "=== $module: coverage test + report (coverageFailOnMinimum enforces this module's own thresholds) ==="
            (cd "$module" && sbt "coverage; test; coverageReport")
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            contract/target/scala-2.12/scoverage-report/**
            ir/target/scala-2.12/scoverage-report/**
            fingerprint/target/scala-2.12/scoverage-report/**
            verification-core/target/scala-2.12/scoverage-report/**
            spark-adapter/target/scala-2.12/scoverage-report/**
          if-no-files-found: warn

  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    # Push events only (main, develop, feature/**): the SBOM is an uploaded artifact that nothing
    # in a PR consumes, and generating it rebuilds every module - a full build's worth of runner
    # time on every PR push for no check. It still runs, and still gates `summary`, on the push
    # that follows a merge.
    if: github.event_name != 'pull_request'
    # Downstream transparency, not vulnerability detection (that's the
    # dependency-graph.yml workflow, which feeds Dependabot). This produces
    # a CycloneDX SBOM per publishable artifact so users can run their own
    # scanners (grype, Dependency-Check, ...) against exactly what a real
    # Invaract release depends on. One per module rather than one merged
    # SBOM, since these are 6 separately versioned jars plus the web UI, not
    # a single artifact.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # Reuses the same build entrypoint the `test` job uses, in the same
      # dependency order (contract, ir, plugin concurrently, then
      # spark-adapter, then runner). spark-adapter/runner both need sibling
      # modules resolvable — contract/ir/spark-adapter via publishLocal'd
      # libraryDependencies, plugin via unmanagedJars — so `sbt makeBom`
      # can't safely run standalone per-module the way the
      # dependency-graph.yml submissions do. dev/build is a pure sbt
      # compile/assemble step - no Spark install needed (unlike the `test`
      # and `mutation-testing` jobs, which run/mutate against a real
      # local[*] Spark session and need spark-submit on PATH for that).
      - name: Build all modules
        run: ./dev/build
        shell: bash

      # Once dev/build above has put every sibling jar in place, these 5
      # invocations have no ordering dependency on each other (unlike the
      # build itself) - each is just that module's own already-resolved
      # dependency graph written to a file. Backgrounding them cuts the
      # per-module JVM/sbt startup + resolution overhead from paying out
      # serially 5 times to paying out roughly once.
      - name: Generate SBOM for each Scala module
        shell: bash
        run: |
          # pipefail: without it, a subshell's exit status is `sed`'s (the
          # last command in its pipeline), which is always 0 - masking a
          # real `sbt makeBom` failure and letting this step pass silently.
          set -o pipefail
          # Every module in modules.json; check_modules.py fails when this list drifts from it.
          pids=()
          for m in contract ir fingerprint verification-core adapter-testkit plugin spark-adapter runner notification-kafka registry-client; do
            (cd "$m" && sbt makeBom 2>&1 | sed "s/^/[$m] /") &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit $status

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Generate SBOM for web
        working-directory: web
        run: |
          npm ci
          npm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sboms
          path: |
            contract/target/*.bom.json
            ir/target/*.bom.json
            fingerprint/target/*.bom.json
            verification-core/target/*.bom.json
            adapter-testkit/target/*.bom.json
            plugin/target/*.bom.json
            spark-adapter/target/*.bom.json
            runner/target/*.bom.json
            notification-kafka/target/*.bom.json
            registry-client/target/*.bom.json
            web/sbom.json
          if-no-files-found: error

  notification-kafka:
    name: Build and test notification-kafka
    runs-on: ubuntu-latest
    # A single Linux/JDK-21 leg, not the full OS/Java matrix `test` runs:
    # unlike spark-adapter, this module has no Spark dependency at all
    # (kafka-clients + spark-adapter's own compiled classes are all it
    # needs), so there's no Hadoop-native/Spark-on-Windows/JDK-11-Catalyst
    # class of platform-specific risk here to catch - the same "measures
    # correctness, not OS/JDK compatibility" reasoning the mutation-testing
    # jobs already use for skipping the full matrix.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      # notification-kafka needs spark-adapter's assembly jar (for
      # NotificationSink/NotificationEvent) via unmanagedJars - unchanged.
      # But spark-adapter's own build.sbt now resolves ir/contract/
      # fingerprint as real libraryDependencies (see spark-adapter/build.sbt's
      # comment), so those three need `publishLocal`, not `assembly`, before
      # spark-adapter itself can even compile - the same chain dev/build
      # establishes, reproduced minimally here since this job needs no Spark
      # installation at all (spark-core/spark-sql are `provided`-scope
      # *compile* dependencies of spark-adapter, resolved from Maven Central -
      # no local Spark distribution or spark-submit required just to produce
      # its jar).
      - name: Publish contract, ir, and fingerprint locally
        uses: ./.github/actions/publish-engine-modules

      - name: Build spark-adapter
        shell: bash
        run: cd spark-adapter && sbt assembly

      - name: Test notification-kafka
        run: cd notification-kafka && sbt test
        shell: bash

  registry-client:
    name: Build and test registry-client
    runs-on: ubuntu-latest
    # registry-client (docs/CONTRACT_REGISTRY.md) is opt-in and not built by dev/build, so nothing else
    # compiles it: it pinned a contract version that no longer existed, and could not build at all, without
    # any check noticing. A single Linux leg is enough (no Spark, no platform-specific code).
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21 and sbt
        uses: ./.github/actions/setup-jdk-sbt

      - name: Publish contract locally (registry-client's libraryDependency)
        uses: ./.github/actions/publish-engine-modules

      - name: Test registry-client
        run: cd registry-client && sbt test
        shell: bash

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, changes, docker-regression, mutation-testing-ir, mutation-testing-fingerprint, mutation-testing-verification-core, mutation-testing-adapter-testkit, mutation-testing-spark-adapter, mutation-testing-spark-adapter-incremental, mutation-shard-drift-check, spark-version-matrix, delta-version-matrix, iceberg-version-matrix, version-matrix-drift-check, docs-drift-check, workflow-scripts, adapter-scaffold-check, api-compatibility, coverage-gating, sbom, notification-kafka, registry-client]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.changes.result }}" == "failure" ] || [ "${{ needs.docker-regression.result }}" == "failure" ] || [ "${{ needs.mutation-testing-ir.result }}" == "failure" ] || [ "${{ needs.mutation-testing-fingerprint.result }}" == "failure" ] || [ "${{ needs.mutation-testing-verification-core.result }}" == "failure" ] || [ "${{ needs.mutation-testing-adapter-testkit.result }}" == "failure" ] || [ "${{ needs.mutation-testing-spark-adapter.result }}" == "failure" ] || [ "${{ needs.mutation-testing-spark-adapter-incremental.result }}" == "failure" ] || [ "${{ needs.mutation-shard-drift-check.result }}" == "failure" ] || [ "${{ needs.spark-version-matrix.result }}" == "failure" ] || [ "${{ needs.delta-version-matrix.result }}" == "failure" ] || [ "${{ needs.iceberg-version-matrix.result }}" == "failure" ] || [ "${{ needs.version-matrix-drift-check.result }}" == "failure" ] || [ "${{ needs.docs-drift-check.result }}" == "failure" ] || [ "${{ needs.workflow-scripts.result }}" == "failure" ] || [ "${{ needs.adapter-scaffold-check.result }}" == "failure" ] || [ "${{ needs.api-compatibility.result }}" == "failure" ] || [ "${{ needs.coverage-gating.result }}" == "failure" ] || [ "${{ needs.sbom.result }}" == "failure" ] || [ "${{ needs.notification-kafka.result }}" == "failure" ] || [ "${{ needs.registry-client.result }}" == "failure" ]; then
            echo "❌ Tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
