# Mutation testing config for the `ir` module (Stryker4s).
# See docs/SPARK_ADAPTER.md's "Property-based fuzzing" section for the
# other regression-testing guardrails this project has adopted.
#
# The `mutate` scope (currently just Lineage.scala - the correctness-
# critical file in this module, where a wrong answer is worse than an
# incomplete one) is set via build.sbt's `strykerMutate` instead of here;
# see that file for why. Widen it to "src/main/scala/**/*.scala" once the
# initial mutation score has been reviewed and any real survivors
# addressed.
reporters: ["console", "html"]
