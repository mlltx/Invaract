# Notification sink config for dev/regression's FAIL case - see
# demo/notify.properties for the general explanation. Proves the sink is
# published even when the write is rejected (see
# ContractEnforcementRule.verifyOrThrow: a ContractValidationEvent is
# always published before a failing check throws).
sink.enabled=true
sink.class=com.example.sparkadapter.notification.FileNotificationSink
sink.property.path=demo/output/regression_fail_events.jsonl
