# Notification sink config for dev/regression's PASS case - see
# demo/notify.properties for the general explanation. A separate file
# (rather than reusing demo/notify.properties) so the regression pack's own
# events don't mix with dev/test's, or with the FAIL case's.
sink.enabled=true
sink.class=com.invaract.sparkadapter.notification.FileNotificationSink
sink.property.path=demo/output/regression_pass_events.jsonl
