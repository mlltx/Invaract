# Notification sink config for dev/regression's Case 9 (derivedFrom: write reads only its own inputs) - see
# demo/notify.properties for the general explanation. A separate file so the
# regression pack's own events don't mix with dev/test's, or with any other case's.
sink.enabled=true
sink.class=com.invaract.sparkadapter.notification.FileNotificationSink
sink.property.path=demo/output/regression_derived_pass_events.jsonl
