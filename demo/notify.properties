# Notification sink configuration for DemoJobHarness (see
# com.invaract.sparkadapter.notification's package doc and docs-site's
# "Notification sinks" guide). Used by ./dev/test and ./dev/regression to
# prove, against a real Spark job, that ContractValidationEvent/WriteEvent
# are actually published - not just unit-tested in isolation.
#
# FileNotificationSink appends one JSON object per line to sink.property.path.
# This is a demonstration config, not something a real deployment should
# copy verbatim - see the docs-site guide for other sinks (e.g. a custom
# one calling out to a message queue or HTTP endpoint).
sink.enabled=true
sink.class=com.invaract.sparkadapter.notification.FileNotificationSink
sink.property.path=demo/output/events.jsonl
