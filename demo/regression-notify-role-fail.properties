# Notification sink config for dev/regression's role-consistency FAIL case -
# see demo/notify.properties for the general explanation. Proves
# roleConformance is published on the ContractValidationEvent even when the
# check fails and the write is aborted (see docs-site's "Configure a
# Notification Sink" guide).
sink.enabled=true
sink.class=com.invaract.sparkadapter.notification.FileNotificationSink
sink.property.path=demo/output/regression_role_fail_events.jsonl
