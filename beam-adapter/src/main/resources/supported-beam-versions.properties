# The Apache Beam releases beam-adapter has real CI evidence for: its own test suite (the 51 conformance scenarios run as
# real pipelines on the in-process DirectRunner, the attach tests and the unit tests) passes against each one.
#
# beam.primary  - the release build.sbt compiles and tests against by default.
# beam.verified - every release CI's beam-version-matrix job runs the suite against. A release is added to that job's
#                 matrix first and promoted here only once a real CI run has passed on it; version-matrix-drift-check
#                 fails when a release listed here is not in the matrix.
#
# The adapter reads a FileIO write's destination and sink from non-public members of FileIO.Write and recognises
# IO transforms by class name (BeamInternals); a release that changes either fails closed (the write is refused as
# unverifiable), and this matrix is how a change is seen before a user meets it.
beam.primary=2.77.0
beam.verified=2.60.0,2.65.0,2.70.0,2.77.0
