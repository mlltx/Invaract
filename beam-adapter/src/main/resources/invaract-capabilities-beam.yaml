# What the Beam adapter verifies - the source of truth for the engine capability matrix
# (docs-site: reference/engine-capabilities, generated by `./dev/capabilities`) and what the
# verification pipeline consults when a contract relies on something an adapter can't check.
#
# Every capability in verification-core's `Capability` vocabulary must be declared here
# (AdapterCapabilities.parse refuses a file that leaves one out): an adapter that cannot do
# something says so, with a reason. Anything other than `supported` needs a `note`.
#
# Written from docs/BEAM_ADAPTER_SURVEY.md and held to the conformance kit: a capability is `supported`
# only if the kit's scenario for it passes on a real Beam pipeline (BeamConformanceSpec), or, for the
# ones no job can show, a named test demonstrates it (BeamAttestedClaimsSpec).
adapter: beam
engine: Apache Beam (Java SDK)
enforcement:
  point: pre-submit-gate
  note: >-
    A wrapper runner, named by --runner, receives the constructed pipeline in run(), reads its graph (before any
    step executes), verifies it against the contract, and either throws (the pipeline is never submitted) or hands
    it to the real runner. Nothing inside a running pipeline is intercepted.
capabilities:
  read.batch:
    status: supported
    note: For the read transforms the adapter recognises (TextIO, AvroIO, ParquetIO, BigQueryIO and similar), whose location the graph states. A read through a source it does not recognise is not seen as an input.
  read.streaming:
    status: unsupported
    note: An unbounded read is visible (PCollection.isBounded), but no streaming job has been run to completion under the conformance kit on the in-process runner, so nothing is claimed.
  write.batch:
    status: supported
    note: For the write transforms the adapter recognises. A terminal step it does not recognise is treated as an unverifiable write (failClosed.unverifiableWrites).
  write.streaming:
    status: unsupported
    note: As read.streaming.
  write.rowLevelDml:
    status: not-applicable
    note: Beam has no row-level MERGE, UPDATE or DELETE; a pipeline reads collections and writes new output.
  write.stateChange:
    status: not-applicable
    note: Beam has no operation that commits a schema change without writing rows.
  check.inputExistence:
    status: supported
  check.location:
    status: supported
    note: TextIO states its read pattern as given but its write prefix as an absolute path, so both are normalised; a FileIO write states no location in its display data and is read through WriteFiles.getSink() (unverified).
  check.schema:
    status: partial
    note: Known where the sink or the collection carries a schema (Parquet and Avro schemas, BigQuery table schemas, Beam row schemas). A text sink, or a collection of plain Java objects with no schema, has none to compare.
  check.nestedTypes:
    status: supported
    note: Beam ROW, ARRAY and MAP, and Avro records, arrays and maps, map to struct, array and map wherever a schema is known.
  check.format:
    status: partial
    note: The format is the IO transform (ParquetIO is parquet, AvroIO is avro). TextIO cannot tell csv from json from plain text.
  check.saveMode:
    status: unsupported
    note: File-based writes have no write disposition in Beam, so a job cannot say append or overwrite. BigQueryIO does (WRITE_APPEND, WRITE_TRUNCATE, WRITE_EMPTY) and could support this later.
  check.catalogRegistration:
    status: unsupported
    note: A file-based Beam write has no catalog. A BigQueryIO write is to a catalog table and could support this later.
  rules.dml:
    status: not-applicable
    note: There is no row-level DML in Beam.
  rules.planShape:
    status: unsupported
    note: The fields a schema filter, join or group-by uses are held in non-public state and the plain-function forms are opaque; supporting these would rest on reflection into Beam internals or on analysing SQL (SqlTransform).
  rules.custom:
    status: unsupported
    note: Custom rule verifiers are given a row-level change to judge, and Beam has none.
  analysis.staticDataQuality:
    status: unsupported
    note: Proving a property of an output column needs to see how it is computed; functions in Beam are opaque Java code.
  analysis.roleConsistency:
    status: unsupported
    note: Needs column-level usage, which the graph does not give.
  analysis.fingerprint:
    status: unsupported
    note: A fingerprint of the graph alone would not capture the logic inside functions and would mislead.
  analysis.functionCatalog:
    status: unsupported
    note: Beam jobs call Java methods, not named engine functions.
  analysis.sensitivityPropagation:
    status: unsupported
    note: Needs column-level lineage.
  lineage.columnLevel:
    status: unsupported
    note: Needs to see how each output column is computed, which opaque functions hide.
  lineage.boundaryResolution:
    status: not-applicable
    note: A Beam pipeline is an immutable graph; there is no checkpoint or cache that erases what produced a collection.
  policy.organizational:
    status: supported
  config.zeroCodeInstall:
    status: partial
    note: --runner names the wrapper and the Invaract settings are Beam options registered through ServiceLoader (both shown to work). A job that sets its runner in its own code bypasses it.
  config.locationRefs:
    status: supported
  config.contractRegistry:
    status: supported
  reporting.notifications:
    status: supported
  reporting.dryRunInference:
    status: partial
    note: Inputs and outputs and their schemas can be inferred where the graph states them; text outputs have no schema to infer.
  failClosed.unverifiableWrites:
    status: partial
    note: A terminal step that is not a recognised sink is refused. A function that writes to an outside system in the middle of the pipeline is invisible to the graph.
