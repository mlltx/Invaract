# What the Beam adapter verifies - the source of truth for the engine capability matrix
# (docs-site: reference/engine-capabilities, generated by `./dev/capabilities`) and what the
# verification pipeline consults when a contract relies on something an adapter can't check.
#
# Every capability in verification-core's `Capability` vocabulary must be declared here
# (AdapterCapabilities.parse refuses a file that leaves one out): an adapter that cannot do
# something says so, with a reason. Anything other than `supported` needs a `note` (for contributors)
# and a `summary` (one plain sentence for users: the "What Each Engine Checks" page, written by EngineGuidePage).
#
# Written from docs/BEAM_ADAPTER_SURVEY.md and held to the conformance kit: a capability is `supported`
# only if the kit's scenario for it passes on a real Beam pipeline (BeamConformanceSpec), or, for the
# ones no job can show, a named test demonstrates it (BeamAttestedClaimsSpec).
adapter: beam
engine: Apache Beam (Java SDK)
guide: /guides/using-invaract-with-apache-beam/
enforcement:
  point: pre-submit-gate
  note: >-
    A wrapper runner, named by --runner, receives the constructed pipeline in run(), reads its graph (before any
    step executes), verifies it against the contract, and either throws (the pipeline is never submitted) or hands
    it to the real runner. Nothing inside a running pipeline is intercepted.
capabilities:
  read.batch:
    status: supported
    note: >-
      For the reads whose source the graph states - TextIO, AvroIO, ParquetIO and TFRecordIO reads, FileIO.match() and the
      readFiles() that read what it matches, BigQueryIO tables, KafkaIO topics, JdbcIO tables and plain single-table queries,
      PubsubIO topics. A read from outside the pipeline that states no location (a BigQuery or complex JDBC query,
      Read.from a source it does not know, patterns the job computes) is still seen: a declared input it may hide is
      reported unverifiable rather than missing, and with rejectUndeclaredInputs the write is refused.
  read.streaming:
    status: supported
    note: >-
      The same reads, unbounded - FileIO.match().continuously(), TextIO.read().watchForNewFiles(), KafkaIO, PubsubIO.
      The graph is the same before submission whether a collection is bounded or not, so a stream is checked like a
      batch; the conformance kit's streaming scenarios run one to completion on the in-process runner.
  write.batch:
    status: supported
    note: >-
      File writes (TextIO, AvroIO, TFRecordIO, FileIO.write with the Parquet, Avro and text sinks), BigQueryIO tables,
      KafkaIO topics, JdbcIO plain INSERT INTO one table, PubsubIO topics. A terminal step it does not recognise, or one
      whose destination the job computes per element (dynamic destinations), is refused as unverifiable
      (failClosed.unverifiableWrites).
  write.streaming:
    status: supported
    note: Windowed file writes, BigQueryIO, KafkaIO and PubsubIO writes of an unbounded collection, checked as their batch forms are.
  write.rowLevelDml:
    status: not-applicable
    summary: "Beam has no MERGE, UPDATE or DELETE: a pipeline only writes new output."
    note: Beam has no row-level MERGE, UPDATE or DELETE; a pipeline reads collections and writes new output.
  write.stateChange:
    status: not-applicable
    summary: "Beam has no operation that changes a table without writing rows."
    note: Beam has no operation that commits a schema change without writing rows.
  check.inputExistence:
    status: supported
  check.location:
    status: supported
    note: TextIO states its read pattern as given but its write prefix as an absolute path, so both are normalised; a FileIO write states no location in its display data, so its output directory is read from FileIO.Write by reflection (Beam 2.77.0; a write it cannot read is refused as unverifiable).
  check.outputsWritten:
    status: supported
    note: The whole pipeline is known before it runs, so a declared output that no recognised write lands on refuses the job before anything starts.
  check.schema:
    status: partial
    summary: "Columns are checked where the pipeline states them: Parquet and Avro schemas, BigQuery table schemas and Beam rows. A write of plain Java objects or of text lines has no columns to compare, so it is refused unless its output declares none."
    note: Known where the sink or the collection carries a schema (Parquet and Avro schemas, BigQuery table schemas, Beam row schemas). A text sink, or a collection of plain Java objects with no schema, has none to compare; its write is refused unless the output declares no columns.
  check.nestedTypes:
    status: supported
    note: Beam ROW, ARRAY and MAP, and Avro records, arrays and maps, map to struct, array and map wherever a schema is known.
  check.format:
    status: partial
    summary: "The format comes from the IO the pipeline uses. A text write cannot tell CSV from JSON or plain text."
    note: The format is the IO transform (ParquetIO is parquet, AvroIO is avro). TextIO cannot tell csv from json from plain text.
  check.saveMode:
    status: partial
    summary: "Only BigQuery writes state a save mode. A contract that declares one for a file, Kafka, JDBC or Pub/Sub write has that write refused."
    note: >-
      BigQueryIO writes state one (WRITE_APPEND, WRITE_TRUNCATE, WRITE_EMPTY are append, overwrite, error). File, Kafka,
      JDBC and Pub/Sub writes have no write disposition in Beam, so a contract that declares a save mode for one of them
      has the write refused as unverifiable rather than passed unchecked.
  check.catalogRegistration:
    status: partial
    summary: "BigQuery tables are checked against the `bigquery` catalog. Files, Kafka, JDBC and Pub/Sub have no catalog in Beam, so a requirement on them is never met."
    note: >-
      A BigQueryIO table is registered in the bigquery catalog under its project, dataset and table, and is checked as
      such (on the read side too). File, Kafka and JDBC datasets have no catalog in Beam, so a contract requiring one
      sees them as unregistered.
  rules.dml:
    status: not-applicable
    summary: "Beam has no MERGE, UPDATE or DELETE to make rules about."
    note: There is no row-level DML in Beam.
  rules.planShape:
    status: partial
    summary: "Checked where the pipeline uses Beam's schema transforms (`Filter`, `Group`, `Join`, `CoGroup`) or Beam SQL's GROUP BY and JOIN. A filter, grouping or join written as code is a black box: it does not satisfy a rule, and under `forbid_cross_join` a step that combines collections in code is refused."
    note: >-
      Read from Beam's schema transforms - Filter.create().whereFieldName(s), Group.byFieldNames/byFieldIds (with or without
      aggregation) and Group.globally(), Join (inner, outer, broadcast) and CoGroup - whose fields are read by reflection from
      members the version matrix checks on every Beam release; a Beam SQL query's GROUP BY and JOIN are built from these and
      are seen too. A filter, grouping or join written as code (Filter.by, a DoFn, GroupByKey, CoGroupByKey), or a SQL WHERE
      (compiled into code), is opaque: a required_* rule is not met by it, and under
      forbid_cross_join a step that combines several collections in code refuses the write as unverifiable, as does a schema
      transform whose fields cannot be read under any of these rules.
  rules.custom:
    status: unsupported
    summary: "Custom rule types judge row-level changes, and Beam has none."
    note: Custom rule verifiers are given a row-level change to judge, and Beam has none.
  analysis.staticDataQuality:
    status: unsupported
    summary: "Beam steps are Java code Invaract cannot look inside, so it cannot prove what a column will contain."
    note: Proving a property of an output column needs to see how it is computed; functions in Beam are opaque Java code.
  analysis.roleConsistency:
    status: unsupported
    summary: "Needs to know how each column is used, which Beam's description of a pipeline does not say."
    note: Needs column-level usage, which the graph does not give.
  analysis.fingerprint:
    status: unsupported
    summary: "A fingerprint of the pipeline's shape alone would miss the logic inside its steps, so none is computed."
    note: A fingerprint of the graph alone would not capture the logic inside functions and would mislead.
  analysis.functionCatalog:
    status: unsupported
    summary: "Beam pipelines call Java methods, not the engine's own named functions."
    note: Beam jobs call Java methods, not named engine functions.
  analysis.sensitivityPropagation:
    status: unsupported
    summary: "Needs to trace each column through the pipeline, which Beam's description of it does not allow."
    note: Needs column-level lineage.
  lineage.columnLevel:
    status: unsupported
    summary: "Beam steps are Java code Invaract cannot look inside, so it cannot tell which input columns each output column comes from."
    note: Needs to see how each output column is computed, which opaque functions hide.
  lineage.boundaryResolution:
    status: not-applicable
    summary: "A Beam pipeline has no checkpoint or cache that hides what produced its data."
    note: A Beam pipeline is an immutable graph; there is no checkpoint or cache that erases what produced a collection.
  policy.organizational:
    status: supported
  config.zeroCodeInstall:
    status: partial
    summary: "Turned on with `--runner` and the `--invaract...` options on the job's command line. A job that sets its runner in its own code bypasses it."
    note: --runner names the wrapper and the Invaract settings are Beam options registered through ServiceLoader (both shown to work). A job that sets its runner in its own code bypasses it.
  config.locationRefs:
    status: supported
  config.contractRegistry:
    status: supported
  reporting.notifications:
    status: supported
  reporting.dryRunInference:
    status: partial
    summary: "Drafts list every read and write the pipeline locates, with columns where it states them; one without columns gets a draft that declares none, and says so."
    note: Every located read and write is in the draft, with columns where the graph states them; one with none (a text write of strings) is drafted without columns, and the draft says so. Each draft, self-checked against its own write, then one job summary merging them, is published before the pipeline runs.
  failClosed.unverifiableWrites:
    status: partial
    summary: "A step that ends the pipeline without being a write Invaract recognizes is refused. A step that writes to an outside system in the middle of the pipeline cannot be seen before it runs."
    note: A terminal step that is not a recognised sink is refused. A function that writes to an outside system in the middle of the pipeline is invisible to the graph.
