# What the Beam adapter verifies for pipelines written with Beam's Python SDK - the source of truth for this
# adapter's column of the engine capability matrix (docs-site: reference/engine-capabilities, generated by
# `./dev/capabilities`) and what the checker consults when a contract relies on something it can't check.
#
# Every capability in verification-core's `Capability` vocabulary must be declared here (AdapterCapabilities.parse
# refuses a file that leaves one out). Anything other than `supported` needs a `note`.
#
# Written from docs/BEAM_PYTHON_ADAPTER_SURVEY.md and held to the conformance kit: a capability is `supported` only if
# the kit's scenarios for it pass with real Python pipelines (BeamPythonConformanceSpec), or, for the ones no job can
# show, a named test demonstrates it (BeamPythonAttestedClaimsSpec). The design is docs/BEAM_PYTHON_ADAPTER.md.
adapter: beam-python
engine: Apache Beam (Python SDK)
enforcement:
  point: pre-submit-gate
  note: >-
    A wrapper runner, named by --runner=invaract_beam.InvaractRunner, receives the constructed pipeline in run_pipeline(),
    writes its portable form (the language-neutral description every Beam SDK produces) to a file, and runs the Java
    checker on it before any step executes; the pipeline is handed to the real runner only if the checker lets it
    through. Nothing inside a running pipeline is intercepted.
capabilities:
  read.batch:
    status: supported
    note: >-
      Every read the Python SDK states a source for: the file reads (ReadFromParquet, ReadFromText, ReadFromAvro,
      ReadFromTFRecord), BigQuery tables (both read methods), Pub/Sub topics and subscriptions. A read that states no
      location (a BigQuery query, a CSV read through pandas, a source class it does not know, files matched by fileio, a
      template parameter, a Java transform used from Python) is still seen: a declared input it may hide is reported
      unverifiable rather than missing, and with rejectUndeclaredInputs the write is refused.
  read.streaming:
    status: partial
    note: >-
      A Pub/Sub read is located by its topic. A file stream (fileio.MatchContinuously) states no file pattern in the
      pipeline's portable form, so it is a read that is not located: a declared input it may be is reported unverifiable,
      not checked. A stream is otherwise translated as a batch is.
  write.batch:
    status: supported
    note: >-
      File writes (WriteToParquet, WriteToText, WriteToAvro, WriteToTFRecord), BigQuery tables, Pub/Sub topics. A step that
      ends the pipeline without being one of these (a CSV write through pandas, fileio.WriteToFiles, a function with side
      effects), or a BigQuery write whose table the job computes, is refused as unverifiable (failClosed.unverifiableWrites).
  write.streaming:
    status: supported
    note: A windowed file write, a BigQuery write and a Pub/Sub write of an unbounded collection are the same steps as their batch forms, and are checked as they are.
  write.rowLevelDml:
    status: not-applicable
    note: Beam has no row-level MERGE, UPDATE or DELETE; a pipeline reads collections and writes new output.
  write.stateChange:
    status: not-applicable
    note: Beam has no operation that commits a schema change without writing rows.
  check.inputExistence:
    status: supported
  check.location:
    status: supported
    note: A read is the folder its file pattern reads; a write is its file pattern up to the shard template (the prefix a Java TextIO write is located by); a BigQuery table is project/dataset/table.
  check.outputsWritten:
    status: supported
    note: The whole pipeline is known before it runs, so a declared output that no recognised write lands on refuses the job before anything starts.
  check.schema:
    status: partial
    note: >-
      Known where the write states the schema its files are written with (a Parquet write's pyarrow schema, an Avro write's
      record schema, a BigQuery load's table schema) or the data carries a Beam row schema (typed rows, ReadFromParquet with
      as_rows=True). Python dictionaries, and a row schema with an untyped field (a computed beam.Select field), have no
      columns to compare; such a write is refused unless the output declares no columns.
  check.nestedTypes:
    status: supported
    note: pyarrow lists, structs and maps, Avro records, arrays and maps, BigQuery RECORD and REPEATED fields and Beam row, array and map fields map to struct, array and map wherever a schema is known.
  check.format:
    status: partial
    note: The format is the sink the write uses (parquet, avro, tfrecord, text). A text write cannot tell csv from json from plain text.
  check.saveMode:
    status: partial
    note: >-
      A BigQuery write states one (WRITE_APPEND, WRITE_TRUNCATE, WRITE_EMPTY are append, overwrite, error). File and
      Pub/Sub writes have no write disposition in Beam, so a contract that declares a save mode for one of them has the
      write refused as unverifiable rather than passed unchecked.
  check.catalogRegistration:
    status: partial
    note: A BigQuery table is registered in the bigquery catalog under its project, dataset and table (on the read side too). File and Pub/Sub datasets have no catalog in Beam, so a contract requiring one sees them as unregistered.
  rules.dml:
    status: not-applicable
    note: There is no row-level DML in Beam.
  rules.planShape:
    status: unsupported
    note: >-
      Python's filters and joins are code (beam.Filter takes a function, a join is CoGroupByKey) and a beam.GroupBy's keys
      are held only in pickled Python, so the portable form states no filter, join or grouping column. A contract with a
      transformation-shape rule is refused with UNSUPPORTED_CONTRACT_FEATURE before the job starts.
  rules.custom:
    status: unsupported
    note: Custom rule verifiers are given a row-level change to judge, and Beam has none.
  analysis.staticDataQuality:
    status: unsupported
    note: Proving a property of an output column needs to see how it is computed; functions in a Python pipeline are pickled Python code.
  analysis.roleConsistency:
    status: unsupported
    note: Needs column-level usage, which the portable form does not give.
  analysis.fingerprint:
    status: unsupported
    note: A fingerprint of the pipeline's shape alone would not capture the logic inside its functions and would mislead.
  analysis.functionCatalog:
    status: unsupported
    note: Python pipelines call Python functions, not named engine functions.
  analysis.sensitivityPropagation:
    status: unsupported
    note: Needs column-level lineage.
  lineage.columnLevel:
    status: unsupported
    note: Needs to see how each output column is computed, which pickled functions hide.
  lineage.boundaryResolution:
    status: not-applicable
    note: A Beam pipeline is an immutable graph; there is no checkpoint or cache that erases what produced a collection.
  policy.organizational:
    status: supported
  config.zeroCodeInstall:
    status: partial
    note: >-
      --runner=invaract_beam.InvaractRunner and the --invaract_* flags on the job's command line, with the invaract_beam
      package installed and Java 11 or later where the job is submitted. A job that sets its runner in its own code, or does
      not pass its command line to Beam, bypasses it; a job submitted without the package, or without Java, does not start.
  config.locationRefs:
    status: supported
  config.contractRegistry:
    status: supported
  reporting.notifications:
    status: supported
  reporting.dryRunInference:
    status: partial
    note: Inputs and outputs and their schemas are inferred where the pipeline states them; a write whose columns cannot be told gets a draft output that declares none. Each draft, self-checked against its own write, then one job summary merging them, is published before the pipeline runs.
  failClosed.unverifiableWrites:
    status: partial
    note: A step that ends the pipeline without being a recognised write is refused, unless it reads only what a write reports or the platform trusts it (--invaract_trusted_steps). A function that writes to an outside system in the middle of the pipeline is invisible to any check made before it runs.
