sink.enabled=true
sink.class=com.invaract.verification.notification.FanOutNotificationSink
sink.property.sinks=endpoint,file,log
sink.property.endpoint.class=com.invaract.verification.notification.HttpNotificationSink
sink.property.endpoint.property.url=${HTTP}
sink.property.endpoint.statuses=FAILED
sink.property.file.class=com.invaract.verification.notification.FileNotificationSink
sink.property.file.property.path=${CASE}/events.jsonl
sink.property.log.class=com.invaract.verification.notification.LoggingNotificationSink
