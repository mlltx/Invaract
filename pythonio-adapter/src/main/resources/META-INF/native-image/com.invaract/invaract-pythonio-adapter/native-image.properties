# How the checker is built as a native program (docs/PYTHON_IO_ADAPTER_DESIGN.md, milestone 0). native-image reads this
# from the jar, so `native-image -jar invaract-pythonio-checker-<version>.jar` needs no other arguments.
# --no-fallback: fail the build rather than produce a program that needs a JVM. --enable-url-protocols: the HTTP
# notification sink. --initialize-at-build-time is left at its default (run time), the safe choice for SnakeYAML.
Args = --no-fallback \
       --enable-url-protocols=http,https \
       -H:+ReportExceptionStackTraces
