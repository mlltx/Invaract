# What the PythonIo adapter verifies - the source of truth for the engine capability matrix
# (docs-site: reference/engine-capabilities, generated by `./dev/capabilities`) and what the
# verification pipeline consults when a contract relies on something an adapter can't check.
#
# Every capability in verification-core's `Capability` vocabulary must be declared here
# (AdapterCapabilities.parse refuses a file that leaves one out): an adapter that cannot do
# something says so, with a reason. Anything other than `supported` needs a `note` (for contributors)
# and a `summary` (one plain sentence for users: the "What Each Engine Checks" page, written by EngineGuidePage).
#
# Written from docs/PYTHON_IO_ADAPTER_DESIGN.md and held to the conformance kit twice: PythonIoConformanceAdapter runs each
# scenario through the checker (PythonIoCheck) one protocol request per read and write, and
# PythonIoPackageConformanceAdapter runs it as a real Python job through the `invaract` package.
adapter: pythonio
engine: Python (invaract package)
guide: /guides/using-invaract-with-python/
enforcement:
  point: staged-publish
  note: >-
    The job reads and writes through the invaract package, which stages each output and publishes it only if the whole
    run passed: Parquet or CSV files by a rename (local, HDFS) or a copy with _SUCCESS written last (object storage), a
    Delta or Iceberg table by one commit; a refusal raises ContractViolation in the job.
capabilities:
  read.batch:
    status: supported
    note: >-
      Reads go through invaract.read by the input's declared name, so the checker knows each one exactly: Parquet and CSV
      files (local, HDFS, object storage) and Delta and Iceberg tables.
  read.streaming:
    status: unsupported
    summary: Python jobs read whole datasets; reading a stream is not checked.
    note: The package reads whole datasets (files and tables); there is no streaming read in it.
  write.batch:
    status: supported
    note: Writes go through invaract.write by the output's declared name; the table's columns are read from the data frame (Arrow).
  write.streaming:
    status: unsupported
    summary: Python jobs write whole datasets; writing a stream is not checked.
    note: The package writes whole datasets; there is no streaming write in it.
  write.rowLevelDml:
    status: not-applicable
    summary: The invaract package writes whole outputs; it has no row-level MERGE, UPDATE or DELETE.
    note: The package writes whole outputs (overwrite or append) and offers no row-level change.
  write.stateChange:
    status: not-applicable
    summary: The invaract package has no operation that changes a table without writing rows.
    note: The package offers no operation that commits a schema or table change without writing rows.
  check.inputExistence:
    status: partial
    summary: "A declared input the job never reads, and a read of one the contract does not declare, are both caught. Which of the job's reads went into which output is not known, so every read counts toward every later write."
    note: >-
      Every read names the declared input it reads, so a missing read and an undeclared read are known exactly. Which
      reads fed a write is not: the package sends every read made before the write (docs/PYTHON_ADAPTER_SURVEY.md, D4),
      so it never invents a missing input, but cannot report one only a single write's own reads would show (the kit's
      Scenarios.partialExcuses). With rejectUndeclaredInputs, an earlier read of another output's input counts too.
  check.location:
    status: supported
    note: The package writes to the location the contract declares for the output it names, so the location is the contract's own.
  check.outputsWritten:
    status: supported
    note: The checker records each output written and, when the run finishes, refuses one that never wrote a declared output.
  check.schema:
    status: supported
    note: >-
      The written table's columns and types come from its Arrow schema, mapped to the contract's types by the shared
      ArrowSchemas, and are checked before anything is staged; a required column is checked against the empty values the
      staged data holds (decision 3), not against the frame library's nullable flag.
  check.nestedTypes:
    status: supported
  check.format:
    status: supported
    note: The package writes the format itself (Parquet, CSV, Delta or Iceberg) and says which.
  check.saveMode:
    status: supported
    note: The package applies the save mode itself (overwrite, append, error or ignore) and says which.
  check.catalogRegistration:
    status: partial
    summary: "Iceberg tables are checked against the catalog, namespace and table they are registered in. Files and Delta tables, named by their path, have no catalog, so a requirement on them is never met."
    note: >-
      An Iceberg dataset's location names its catalog, namespace and table, and the package sends them with each read and
      write (technology iceberg; the catalog service's own address is not sent, since a catalog URI can hold credentials).
      Files and Delta tables are addressed by path, so a contract requiring a registration sees them as unregistered.
  check.runtimeDataQuality:
    status: partial
    summary: "Every row a job writes is checked against its output fields' declared constraints before anything is published. Constraints on fields nested in a struct are not checked."
    note: >-
      The package evaluates each constraint (equals, oneOf, range, length, fieldRange) on the data it stages and reports
      how many rows broke it; a run with any is refused and publishes nothing. Only top-level fields are checked.
  rules.dml:
    status: not-applicable
    summary: The invaract package has no row-level changes, so there are no row-level rules to apply.
    note: No row-level MERGE, UPDATE or DELETE exists to judge.
  rules.planShape:
    status: unsupported
    summary: What a Python job does between its reads and writes is its own code, which is not checked.
    note: The transformation is the team's own pandas, Polars or DuckDB code; the checker sees only reads and writes.
  rules.custom:
    status: unsupported
    summary: Custom rules judge a job's plan, and a Python job's plan is its own code, which is not checked.
    note: Custom rules judge the translated plan or row-level changes, and neither exists for a Python job.
  analysis.staticDataQuality:
    status: unsupported
    summary: Data quality rules need the transformation, which for a Python job is its own code.
    note: Static data-quality analysis reads the plan's expressions; the plan is opaque here.
  analysis.roleConsistency:
    status: unsupported
    summary: Column roles need column lineage, which a Python job's own code does not give.
    note: Role consistency needs column-level lineage.
  analysis.fingerprint:
    status: unsupported
    summary: A fingerprint of the transformation needs the transformation, which for a Python job is its own code.
    note: Fingerprinting hashes the plan; the plan is opaque here.
  analysis.functionCatalog:
    status: unsupported
    summary: Which functions a Python job calls is its own code, which is not checked.
    note: The function catalog is read from the plan's expressions; the plan is opaque here.
  analysis.sensitivityPropagation:
    status: unsupported
    summary: Sensitivity is followed through column lineage, which a Python job's own code does not give.
    note: Sensitivity propagation needs column-level lineage.
  lineage.columnLevel:
    status: unsupported
    summary: Which input columns feed which output columns is the job's own code, which is not checked.
    note: Column lineage needs the transformation; the checker sees only reads and writes.
  lineage.boundaryResolution:
    status: not-applicable
    summary: The invaract package has no checkpoint or cache to see through.
    note: No checkpoint or cache stands between a read and a write in the package.
  policy.organizational:
    status: supported
    note: Set with INVARACT_ORG_POLICY, applied when the run opens.
  config.zeroCodeInstall:
    status: unsupported
    summary: A Python job adopts Invaract with a one-time change, reading and writing through the invaract package; its settings then come from INVARACT_ environment variables.
    note: Adopting the package is a one-time change to the job's code by design (docs/PYTHON_IO_ADAPTER_DESIGN.md); settings are environment variables, so a platform configures a job without touching it.
  config.locationRefs:
    status: supported
    note: Set with INVARACT_LOCATION_MAP, resolved when the run opens.
  config.contractRegistry:
    status: supported
    note: INVARACT_CONTRACT may name a registry:// reference, resolved with INVARACT_REGISTRY_URL.
  reporting.notifications:
    status: supported
    note: Set with INVARACT_NOTIFICATION_CONFIG; the checker delivers a run's events before it ends.
  reporting.dryRunInference:
    status: supported
    note: >-
      Set with INVARACT_DRY_RUN=true: reads and writes name their locations, each staged write gets a draft contract
      (CONTRACT_INFERENCE), and the drafts are merged into one for the job when it finishes (DRY_RUN_SUMMARY).
  failClosed.unverifiableWrites:
    status: partial
    summary: A table handed to the invaract package that it cannot describe is refused; a write made around the package (straight to a file) is not seen, and the invaract-lint check finds those in the job's code.
    note: >-
      A table invaract.write cannot read as Arrow (it offers no __arrow_c_stream__) is refused as unverifiable, never written
      unchecked. A write made around the package is invisible to the checker and is not blocked; invaract-lint, run before
      the job, is the guard against those (docs/PYTHON_IO_ADAPTER_DESIGN.md).
