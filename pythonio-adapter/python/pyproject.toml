[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "invaract"
dynamic = ["version"]
description = "Reads and writes a Python job's data by the names its data contract gives, and publishes only what the contract allows."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
polars = ["polars>=1.0"]
# Delta Lake and Iceberg tables (milestone 6); an Iceberg catalog's own extra comes from pyiceberg (pyiceberg[glue], ...)
delta = ["deltalake>=1.0"]
iceberg = ["pyiceberg[pyarrow]>=0.9"]
# Avro and Excel files (the other formats need only pyarrow)
avro = ["fastavro>=1.9"]
excel = ["openpyxl>=3.1"]
# PostgreSQL tables, through ADBC (bulk COPY in and Arrow out)
postgres = ["adbc-driver-postgresql>=1.2", "adbc-driver-manager>=1.2"]
# SQLite tables, through ADBC
sqlite = ["adbc-driver-sqlite>=1.2", "adbc-driver-manager>=1.2"]

[project.urls]
Homepage = "https://github.com/mlltx/Invaract"

[tool.setuptools]
packages = ["invaract"]

# what a wheel carries besides the code (.github/scripts/python_wheel.py): the native checker in a platform wheel, the
# checker jar in the pure-Python one; a source checkout has neither
[tool.setuptools.package-data]
invaract = ["bin/*", "lib/*"]

[tool.setuptools.dynamic]
version = { attr = "invaract.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
