# What the Spark adapter verifies - the source of truth for the engine capability matrix
# (docs-site: reference/engine-capabilities, generated by `./dev/capabilities`) and what the
# verification pipeline consults when a contract relies on something an adapter can't check.
#
# Every capability in verification-core's `Capability` vocabulary must be declared here
# (AdapterCapabilities.parse refuses a file that leaves one out): an adapter that cannot do
# something says so, with a reason. Anything other than `supported` needs a `note`.
#
# Keep this honest, not flattering: `partial` and `unsupported` are the point of the file. A
# change to what the adapter recognizes or checks belongs in the same PR as the line it changes
# here (and the connector write-ups under docs/connectors/).
adapter: spark
engine: Apache Spark 3.5
enforcement:
  point: in-engine-blocking
  note: >-
    A SparkSessionExtensions check rule runs on the analyzed plan and aborts the write before it
    executes (ContractEnforcementRule); a QueryExecutionListener additionally reports completed writes.

capabilities:
  read.batch:
    status: supported
    note: V1 relations, DataSourceV2 catalog tables, Hive tables and JDBC reads are recognized.
    docs: SPARK_ADAPTER.md
  read.streaming:
    status: supported
    note: Legacy V1 and DataSourceV2 streaming sources are recognized as contract inputs.
    docs: SPARK_ADAPTER.md
  write.batch:
    status: supported
    note: Every write shape of the connectors listed in the connector support page (save, saveAsTable, insertInto, writeTo, SQL INSERT/CTAS).
    docs: SPARK_ADAPTER.md
  write.streaming:
    status: partial
    note: Recognized for file and Delta streaming sinks (WriteToStream). Connectors that do not implement a streaming sink at all (for example ClickHouse) cannot be written to by Spark itself.
    docs: connectors/delta.md
  write.rowLevelDml:
    status: supported
    note: Delta MERGE/UPDATE/DELETE, Iceberg copy-on-write and merge-on-read, and DELETE FROM are recognized.
    docs: connectors/iceberg.md
  write.stateChange:
    status: supported
    note: Nine Iceberg CALL procedures that commit a schema change are checked against the contract.
    docs: connectors/iceberg.md

  check.inputExistence:
    status: supported
    note: Also scoped per output through derivedFrom; a read hidden behind an unresolved lineage boundary is reported as unverifiable, not missing.
  check.location:
    status: partial
    note: Declared locations are matched by normalized path suffix. A CTAS with no pre-existing physical path (Hive) has a known, documented location-resolution gap, and ClickHouse reads and writes report locations in different formats.
    docs: SPARK_ADAPTER.md
  check.schema:
    status: supported
    note: Column names follow spark.sql.caseSensitive.
  check.nestedTypes:
    status: supported
    note: array, map and struct are compared structurally, ignoring nullability inside a container.
  check.format:
    status: supported
  check.saveMode:
    status: supported
  check.catalogRegistration:
    status: supported
    note: Hive, Delta and Iceberg catalog registrations are recognized.
    docs: SPARK_ADAPTER.md

  rules.dml:
    status: partial
    note: Fully verified for Delta and for Iceberg copy-on-write. Iceberg merge-on-read UPDATE cannot have its changed columns extracted, so allowed_update_columns on it fails closed (RULE_UNVERIFIABLE_DML) rather than passing.
    docs: connectors/iceberg.md
  rules.planShape:
    status: supported
  rules.custom:
    status: supported

  analysis.staticDataQuality:
    status: supported
    note: Opt-in. Only a proven violation blocks; everything else is reported.
    docs: STATIC_DATA_QUALITY_VERIFICATION.md
  analysis.roleConsistency:
    status: supported
    note: Opt-in. Only a high-confidence contradiction blocks.
  analysis.fingerprint:
    status: supported
    note: Opt-in. Disclosed when it crosses a lineage boundary it could not see through.
    docs: SEMANTIC_LINEAGE_FINGERPRINTING.md
  analysis.functionCatalog:
    status: supported
  analysis.sensitivityPropagation:
    status: supported
  lineage.columnLevel:
    status: partial
    note: A user-defined function body is opaque; it is translated to an explicit UDF node over its declared arguments, and constructs the translator has no case for degrade to an UnknownPlan with a diagnostic.
    docs: TRANSFORMATION_IR.md
  lineage.boundaryResolution:
    status: partial
    note: .checkpoint() and cached relations are resolved back to the work behind them when the enforcement rule saw it; a boundary created before the rule was installed, or an evicted or ambiguous one, stays opaque and is reported as unverifiable.
    docs: SPARK_ADAPTER.md

  policy.organizational:
    status: supported

  config.zeroCodeInstall:
    status: supported
    note: spark.sql.extensions=com.invaract.sparkadapter.InvaractSparkSessionExtension with spark.invaract.* settings; no change to the job.
  config.locationRefs:
    status: supported
  config.contractRegistry:
    status: supported
    note: Needs the registry client on the classpath and spark.invaract.registryUrl; a job that does neither is unaffected.
    docs: CONTRACT_REGISTRY.md

  reporting.notifications:
    status: supported
  reporting.dryRunInference:
    status: supported
    note: Infers from plain writes; row-level DML is inferred from only weakly and state-changing calls are skipped.

  failClosed.unverifiableWrites:
    status: supported
    note: A Command-shaped plan that does not translate and is not on the known-safe list is rejected (UNVERIFIABLE_WRITE).
    docs: SPARK_ADAPTER.md
