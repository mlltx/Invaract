# Canonical list of Spark/Delta/Iceberg versions this module has real CI
# evidence for - the single source every other copy of this claim derives
# from, rather than four independently hand-maintained lists that can (and
# did, twice, in the same session that introduced this file) drift apart:
#
#   - spark-adapter/build.sbt's sparkVersion/deltaVersion/icebergVersion
#     defaults are parsed from this file, not hardcoded separately.
#   - ContractEnforcementRule's runtime compatibility guard is bundled
#     with this file on the classpath (it lives under src/main/resources,
#     so `sbt assembly` includes it automatically) and reads it to decide
#     whether to log a warning - adding a version here is the only edit
#     needed for the guard to recognize it, no Scala code change required.
#   - .github/workflows/test.yml's spark-version-matrix/delta-version-matrix/
#     iceberg-version-matrix jobs stay hand-written (see that file's
#     matrix-drift-check job for why), but that check job parses this file
#     and fails CI if the two disagree.
#   - dev/generate-version-docs reads this file to populate the "Supported
#     versions" tables in docs-site/ and docs/COMPATIBILITY.md - see that
#     script and its own docs-drift CI check.
#
# "primary" is the version spark-adapter is built/tested against by
# default (INVARACT_TEST_*_VERSION env vars override it per CI leg, per
# build.sbt) - always one of the values in the corresponding "verified"
# list. "verified" is comma-separated, no spaces, ordered oldest to newest.
#
# See docs/SPARK_ADAPTER.md's "Spark version compatibility" section and
# docs/connectors/delta.md / docs/connectors/iceberg.md's "Version
# compatibility" sections for the real evidence behind each entry - this
# file is deliberately just the data, not the rationale.

spark.verified=3.5.6,3.5.7,3.5.9
spark.primary=3.5.7

delta.verified=3.3.3
delta.primary=3.3.3

iceberg.verified=1.10.2,1.11.0
iceberg.primary=1.11.0
