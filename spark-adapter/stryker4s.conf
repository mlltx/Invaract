# Mutation testing config for the `spark-adapter` module (Stryker4s).
# See docs/SPARK_ADAPTER.md's "Property-based fuzzing" and "Mutation
# testing" sections for the other regression-testing guardrails this
# project has adopted, and that same doc's "Mutation testing" section for
# this module's own results and history.
#
# `mutate` and `thresholds` are both set via build.sbt's `stryker*`
# settings instead of here - both keys were observed not to take effect
# via this config file with this sbt/plugin version combination. Currently
# whole-module scope.
reporters: ["console", "html"]

# Defaults to availableProcessors/2 (2 test-runners on this environment's
# 4-core box) - a conservative default that leaves this module's
# real-SparkSession-per-test-suite mutation runs (no mocking, per
# ARCHITECTURE.md's ADR-005) slower than the hardware allows. Raised to
# match the actual core count; each test-runner is its own forked JVM
# running a full Spark session, so this trades memory for wall-clock time,
# not test fidelity - no coverage or fidelity is lost by this change.
concurrency: 4
