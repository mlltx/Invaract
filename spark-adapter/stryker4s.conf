# Mutation testing config for the `spark-adapter` module (Stryker4s).
# See docs/SPARK_ADAPTER.md's "Property-based fuzzing" section for the
# other regression-testing guardrails this project has adopted.
#
# The `mutate` scope (currently just StructuralVerifier.scala - the file
# whose violation-detection logic this project's whole value proposition
# rests on, where a false negative is a much worse failure mode than
# incomplete coverage elsewhere) is set via build.sbt's `strykerMutate`
# instead of here; see that file for why. Widen it to
# "src/main/scala/**/*.scala" once the initial mutation score has been
# reviewed and any real survivors addressed.
reporters: ["console", "html"]
