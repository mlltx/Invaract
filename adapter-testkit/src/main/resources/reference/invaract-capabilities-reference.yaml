# The reference adapter: a deliberately tiny engine adapter written against nothing but the
# verification-core SPI (see ReferenceAdapter). It exists to prove the scenarios are consistent
# with the SPI before any real engine is involved, and as a worked example of an adapter's
# declaration. It is not a product adapter and is not listed in the user documentation.
adapter: reference
engine: In-memory reference engine (no engine at all)
enforcement:
  point: pre-submit-gate
  note: >-
    A job description is translated into the engine-neutral plan and verified before anything
    runs; there is no engine to block inside.
capabilities:
  read.batch:
    status: supported
  read.streaming:
    status: supported
    note: The reference engine has no separate streaming runtime, so a streaming job translates to the same plan as the batch job.
  write.batch:
    status: supported
  write.streaming:
    status: supported
    note: The reference engine has no separate streaming runtime, so a streaming job translates to the same plan as the batch job.
  write.rowLevelDml:
    status: supported
    note: A row-level DELETE is translated to a write plus a row mutation.
  write.stateChange:
    status: not-applicable
    note: The reference engine has no such concept.
  check.inputExistence:
    status: supported
  check.location:
    status: supported
  check.schema:
    status: supported
  check.nestedTypes:
    status: supported
  check.format:
    status: supported
  check.saveMode:
    status: supported
  check.catalogRegistration:
    status: supported
    note: A write can carry a catalog identity (a table name), which is all the registration check needs.
  rules.dml:
    status: partial
    note: The DELETE rules are enforced; the reference adapter models only deletes.
  rules.planShape:
    status: supported
  rules.custom:
    status: unsupported
    note: The reference adapter does not implement this; it only covers what the conformance scenarios exercise.
  analysis.staticDataQuality:
    status: supported
    note: Runs the shared verifier over the plan it translates.
  analysis.roleConsistency:
    status: supported
    note: Runs the shared verifier over the plan it translates.
  analysis.fingerprint:
    status: supported
  analysis.functionCatalog:
    status: supported
  analysis.sensitivityPropagation:
    status: supported
    note: Propagates over the plan it translates.
  lineage.columnLevel:
    status: supported
    note: Traces the plan it translates.
  lineage.boundaryResolution:
    status: supported
    note: The reference engine has no checkpoint or cache, so a boundary job translates to the plan it would without one, so there is nothing behind it to lose.
  policy.organizational:
    status: unsupported
    note: The reference adapter does not implement this; it only covers what the conformance scenarios exercise.
  config.zeroCodeInstall:
    status: unsupported
    note: The reference adapter does not implement this; it only covers what the conformance scenarios exercise.
  config.locationRefs:
    status: unsupported
    note: The reference adapter does not implement this; it only covers what the conformance scenarios exercise.
  config.contractRegistry:
    status: unsupported
    note: The reference adapter does not implement this; it only covers what the conformance scenarios exercise.
  reporting.notifications:
    status: supported
  reporting.dryRunInference:
    status: unsupported
    note: The reference adapter does not implement this; it only covers what the conformance scenarios exercise.
  failClosed.unverifiableWrites:
    status: supported
    note: An operation the adapter has no translation for is rejected (UNVERIFIABLE_WRITE) through VerificationPipeline.rejectUnverifiableWrite.
